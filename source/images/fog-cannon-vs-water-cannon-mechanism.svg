<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="25" font-weight="bold" fill="#1F2933">Two Machines, Two Ways of Moving Water</text>
  <text x="40" y="72" font-size="15" fill="#5F6B76">One carries a cloud of droplets. The other drives a pressurised jet. The selection follows from this difference.</text>

  <!-- LEFT: fog cannon -->
  <rect x="40" y="100" width="540" height="500" rx="10" fill="#F5F8FB" stroke="#2E6F8E" stroke-width="2"/>
  <rect x="40" y="100" width="540" height="46" rx="10" fill="#2E6F8E"/>
  <rect x="40" y="130" width="540" height="16" fill="#2E6F8E"/>
  <text x="60" y="130" font-size="19" font-weight="bold" fill="#FFFFFF">Air-assisted fog cannon</text>

  <text x="62" y="180" font-size="14" font-weight="bold" fill="#2E6F8E">WATER PATH</text>

  <!-- water feed -->
  <rect x="64" y="200" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#9FB4C2"/>
  <text x="139" y="223" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Metered water</text>
  <text x="139" y="241" font-size="12" fill="#5F6B76" text-anchor="middle">pump + filtration</text>

  <!-- nozzle -->
  <path d="M262 226 L214 208 L214 244 Z" fill="#2E6F8E"/>
  <text x="238" y="272" font-size="12" fill="#2E6F8E" text-anchor="middle">nozzle ring</text>

  <!-- air shear -->
  <rect x="276" y="200" width="140" height="52" rx="6" fill="#FFFFFF" stroke="#9FB4C2"/>
  <text x="346" y="223" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Sheared by air</text>
  <text x="346" y="241" font-size="12" fill="#5F6B76" text-anchor="middle">droplets 20-150 um</text>

  <!-- fog cloud -->
  <circle cx="470" cy="222" r="16" fill="#BDD7E5"/>
  <circle cx="500" cy="214" r="20" fill="#CFE3EE"/>
  <circle cx="534" cy="224" r="15" fill="#BDD7E5"/>
  <circle cx="490" cy="238" r="17" fill="#CFE3EE"/>
  <circle cx="524" cy="240" r="12" fill="#BDD7E5"/>
  <text x="480" y="272" font-size="12" fill="#2E6F8E" text-anchor="middle">fog cloud</text>

  <!-- fan arrow row -->
  <text x="62" y="312" font-size="14" font-weight="bold" fill="#2E6F8E">DELIVERY</text>
  <rect x="64" y="330" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#9FB4C2"/>
  <text x="164" y="353" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Fan air stream</text>
  <text x="164" y="371" font-size="12" fill="#5F6B76" text-anchor="middle">volume transports fog</text>
  <line x1="272" y1="356" x2="330" y2="356" stroke="#2E6F8E" stroke-width="3"/>
  <polygon points="330,350 344,356 330,362" fill="#2E6F8E"/>
  <rect x="352" y="330" width="204" height="52" rx="6" fill="#EAF2F7" stroke="#2E6F8E"/>
  <text x="454" y="353" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Throw 30 - 300 m</text>
  <text x="454" y="371" font-size="12" fill="#5F6B76" text-anchor="middle">range is the headline spec</text>

  <!-- fog needs open air -->
  <rect x="64" y="404" width="492" height="70" rx="6" fill="#FFFFFF" stroke="#C8D6DF"/>
  <text x="80" y="428" font-size="13" font-weight="bold" fill="#1F2933">Needs room to travel</text>
  <text x="80" y="449" font-size="12.5" fill="#3E4C59">Open yards, stockpiles, haul roads, open transfer areas.</text>
  <text x="80" y="466" font-size="12.5" fill="#3E4C59">In a sealed building it only makes a settled fog layer.</text>

  <rect x="64" y="492" width="492" height="88" rx="6" fill="#FFFFFF" stroke="#C8D6DF"/>
  <text x="80" y="516" font-size="13" font-weight="bold" fill="#1F2933">Sensitivity</text>
  <text x="80" y="537" font-size="12.5" fill="#3E4C59">Needs wind direction and speed by season to place azimuths.</text>
  <text x="80" y="556" font-size="12.5" fill="#3E4C59">Connected load = fan + pump. Water quality controls atomisation.</text>
  <text x="80" y="573" font-size="12.5" fill="#3E4C59">Can be scheduled and interlocked with on-site monitoring.</text>

  <!-- RIGHT: water spray monitor -->
  <rect x="620" y="100" width="540" height="500" rx="10" fill="#FBF6F2" stroke="#A31F34" stroke-width="2"/>
  <rect x="620" y="100" width="540" height="46" rx="10" fill="#A31F34"/>
  <rect x="620" y="130" width="540" height="16" fill="#A31F34"/>
  <text x="640" y="130" font-size="19" font-weight="bold" fill="#FFFFFF">High-pressure water spray monitor</text>

  <text x="642" y="180" font-size="14" font-weight="bold" fill="#A31F34">WATER PATH</text>

  <rect x="644" y="200" width="150" height="52" rx="6" fill="#FFFFFF" stroke="#D8B9C0"/>
  <text x="719" y="223" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Water supply</text>
  <text x="719" y="241" font-size="12" fill="#5F6B76" text-anchor="middle">from the mains or tank</text>

  <polygon points="830,226 794,214 794,238" fill="#A31F34"/>
  <rect x="844" y="200" width="140" height="52" rx="6" fill="#FFFFFF" stroke="#D8B9C0"/>
  <text x="914" y="223" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">High-pressure pump</text>
  <text x="914" y="241" font-size="12" fill="#5F6B76" text-anchor="middle">order 100 bar and above</text>

  <polygon points="984,226 1012,216 1012,236" fill="#A31F34"/>
  <line x1="1016" y1="226" x2="1064" y2="226" stroke="#A31F34" stroke-width="4"/>
  <polygon points="1064,220 1080,226 1064,232" fill="#A31F34"/>
  <circle cx="1092" cy="226" r="5" fill="#A31F34"/>
  <circle cx="1110" cy="220" r="4" fill="#E2B9C2"/>
  <circle cx="1128" cy="228" r="4" fill="#E2B9C2"/>
  <text x="1058" y="272" font-size="12" fill="#A31F34" text-anchor="middle">coherent jet</text>

  <text x="642" y="312" font-size="14" font-weight="bold" fill="#A31F34">DELIVERY</text>
  <rect x="644" y="330" width="200" height="52" rx="6" fill="#FFFFFF" stroke="#D8B9C0"/>
  <text x="744" y="353" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Hydraulic momentum</text>
  <text x="744" y="371" font-size="12" fill="#5F6B76" text-anchor="middle">no air stream at all</text>
  <line x1="852" y1="356" x2="910" y2="356" stroke="#A31F34" stroke-width="3"/>
  <polygon points="910,350 924,356 910,362" fill="#A31F34"/>
  <rect x="932" y="330" width="204" height="52" rx="6" fill="#F8E9EC" stroke="#A31F34"/>
  <text x="1034" y="353" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Throw 10 - 30 m</text>
  <text x="1034" y="371" font-size="12" fill="#5F6B76" text-anchor="middle">precision beats range</text>

  <rect x="644" y="404" width="492" height="70" rx="6" fill="#FFFFFF" stroke="#E0CBD1"/>
  <text x="660" y="428" font-size="13" font-weight="bold" fill="#1F2933">Works at short range</text>
  <text x="660" y="449" font-size="12.5" fill="#3E4C59">Loading points, transfer platforms, chute mouths, galleries, sheds.</text>
  <text x="660" y="466" font-size="12.5" fill="#3E4C59">High wetting force per second onto a defined surface.</text>

  <rect x="644" y="492" width="492" height="88" rx="6" fill="#FFFFFF" stroke="#E0CBD1"/>
  <text x="660" y="516" font-size="13" font-weight="bold" fill="#1F2933">Sensitivity</text>
  <text x="660" y="537" font-size="12.5" fill="#3E4C59">Almost unaffected by wind over a short throw. Aimed, not blanket.</text>
  <text x="660" y="556" font-size="12.5" fill="#3E4C59">Connected load = pump only. Fewer water-treatment constraints.</text>
  <text x="660" y="573" font-size="12.5" fill="#3E4C59">Normally attended: it needs a person, a hose and a clear line.</text>

  <!-- footer rule -->
  <rect x="40" y="618" width="1120" height="2" fill="#DDE3E8"/>
  <text x="40" y="644" font-size="14" font-weight="bold" fill="#1F2933">Rule of thumb: beyond about 50 m choose the fog cannon; inside about 20 m the monitor usually wins.</text>
</svg>