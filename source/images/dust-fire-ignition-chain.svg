<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">From a Thin Layer to a Plant-Wide Event</text>
  <text x="40" y="72" font-size="15" fill="#64748b">Most dust disasters start as a fire nobody classified as a fire</text>

  <g>
    <rect x="40" y="112" width="132" height="118" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="106" y="150" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">1. Dust settles</text>
    <text x="106" y="176" font-size="12" fill="#475569" text-anchor="middle">on beams, cable</text>
    <text x="106" y="194" font-size="12" fill="#475569" text-anchor="middle">trays, lamps,</text>
    <text x="106" y="212" font-size="12" fill="#475569" text-anchor="middle">ducts, ledges</text>

    <path d="M182 171 L 212 171" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="216" y="112" width="132" height="118" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="282" y="150" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">2. Heat arrives</text>
    <text x="282" y="176" font-size="12" fill="#475569" text-anchor="middle">hot bearing,</text>
    <text x="282" y="194" font-size="12" fill="#475569" text-anchor="middle">lamp, welding</text>
    <text x="282" y="212" font-size="12" fill="#475569" text-anchor="middle">spatter, ember</text>

    <path d="M358 171 L 388 171" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="392" y="112" width="132" height="118" rx="10" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="458" y="150" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">3. Smouldering</text>
    <text x="458" y="176" font-size="12" fill="#475569" text-anchor="middle">the layer glows</text>
    <text x="458" y="194" font-size="12" fill="#475569" text-anchor="middle">for hours, no</text>
    <text x="458" y="212" font-size="12" fill="#475569" text-anchor="middle">flame, no alarm</text>

    <path d="M534 171 L 564 171" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="568" y="112" width="132" height="118" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="634" y="150" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">4. Layer ignites</text>
    <text x="634" y="176" font-size="12" fill="#475569" text-anchor="middle">now it is a fire</text>
    <text x="634" y="194" font-size="12" fill="#475569" text-anchor="middle">with a fuel bed</text>
    <text x="634" y="212" font-size="12" fill="#475569" text-anchor="middle">that spreads</text>

    <path d="M710 171 L 740 171" stroke="#0d9488" stroke-width="2.5" marker-end="url(#ar)"/>

    <rect x="744" y="112" width="132" height="118" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
    <text x="810" y="150" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">5. Primary blast</text>
    <text x="810" y="176" font-size="12" fill="#475569" text-anchor="middle">flame lifts the</text>
    <text x="810" y="194" font-size="12" fill="#475569" text-anchor="middle">settled dust off</text>
    <text x="810" y="212" font-size="12" fill="#475569" text-anchor="middle">every surface</text>

    <rect x="900" y="112" width="60" height="118" rx="10" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5"/>
    <text x="930" y="160" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6.</text>
    <text x="930" y="180" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Second</text>
    <text x="930" y="200" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">blast</text>
    <text x="930" y="220" font-size="12" fill="#fecaca" text-anchor="middle">fatal</text>
  </g>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0d9488"/>
    </marker>
  </defs>

  <text x="40" y="278" font-size="14" font-weight="700" fill="#0f172a">Where the timeline splits</text>

  <rect x="40" y="296" width="440" height="86" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="58" y="320" font-size="13" font-weight="700" fill="#0d9488">Stage 1-3: housekeeping problem</text>
  <text x="58" y="342" font-size="12" fill="#475569">Slow, local, invisible. A dust layer can glow for hours.</text>
  <text x="58" y="362" font-size="12" fill="#475569">This is the only window where cleaning still prevents it.</text>

  <rect x="520" y="296" width="440" height="86" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="538" y="320" font-size="13" font-weight="700" fill="#b91c1c">Stage 4-6: emergency</text>
  <text x="538" y="342" font-size="12" fill="#475569">Seconds. The fuel that feeds it was deposited months earlier.</text>
  <text x="538" y="362" font-size="12" fill="#475569">Damage is decided by housekeeping, not by the ignition source.</text>

  <rect x="40" y="410" width="920" height="120" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="58" y="436" font-size="14" font-weight="700" fill="#047857">The uncomfortable conclusion</text>
  <text x="58" y="462" font-size="13" fill="#334155">The ignition source gets the investigation. The dust layer gets the blame.</text>
  <text x="58" y="484" font-size="13" fill="#334155">Removing either one breaks the chain - but only one of them is something</text>
  <text x="58" y="506" font-size="13" fill="#334155">the plant controls every single day.</text>
</svg>
