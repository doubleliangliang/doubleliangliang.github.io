<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660">
  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1F2933">The Droplet Window: Size Decides Capture, Range Decides Reach</text>
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5F5F5F">Droplets far larger than a particle cannot catch it. Droplets small enough to catch it cannot travel far.</text>
  <line x1="349.3" y1="138" x2="349.3" y2="356" stroke="#E7E3DE" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="612.9" y1="138" x2="612.9" y2="356" stroke="#E7E3DE" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="60" y="176" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1F2933">Dust</text>
  <rect x="270.0" y="150" width="573.5" height="40" rx="4" fill="#8A8F98" opacity="0.12" stroke="#8A8F98" stroke-width="1.1"/>
  <text x="282" y="175" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#6B7480">respirable fraction &lt; 10 um</text>
  <text x="60" y="232" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1F2933">Dry fog</text>
  <rect x="349.3" y="206" width="263.6" height="40" rx="4" fill="#2F6B3A" opacity="0.24" stroke="#2F6B3A" stroke-width="1.1"/>
  <text x="361" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#2F6B3A">1-10 um</text>
  <text x="60" y="288" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1F2933">Long-throw monitor</text>
  <rect x="897.3" y="262" width="84.0" height="40" rx="4" fill="#2E6F8E" opacity="0.22" stroke="#2E6F8E" stroke-width="1.1"/>
  <text x="993" y="287" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#2E6F8E">120-250 um</text>
  <text x="60" y="344" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1F2933">Plain water spray</text>
  <rect x="922.9" y="318" width="158.7" height="40" rx="4" fill="#A31F34" opacity="0.18" stroke="#A31F34" stroke-width="1.1"/>
  <text x="935" y="343" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#A31F34">150-600 um</text>
  <path d="M349.3 258 q0 -10 10 -10 L602.9 248 q10 0 10 10" fill="none" stroke="#2F6B3A" stroke-width="1.6"/>
  <path d="M349.3 252 l-4 8 l8 0 z" fill="#2F6B3A"/>
  <path d="M612.9 252 l-4 8 l8 0 z" fill="#2F6B3A"/>
  <text x="639" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#2F6B3A">the band that catches fine dust</text>
  <line x1="270" y1="386" x2="1140" y2="386" stroke="#C7CCD4" stroke-width="1.4"/>
  <line x1="349.3" y1="386" x2="349.3" y2="392" stroke="#C7CCD4" stroke-width="1.2"/>
  <text x="349" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F" text-anchor="middle">1</text>
  <line x1="612.9" y1="386" x2="612.9" y2="392" stroke="#C7CCD4" stroke-width="1.2"/>
  <text x="613" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F" text-anchor="middle">10</text>
  <line x1="876.4" y1="386" x2="876.4" y2="392" stroke="#C7CCD4" stroke-width="1.2"/>
  <text x="876" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F" text-anchor="middle">100</text>
  <line x1="1140.0" y1="386" x2="1140.0" y2="392" stroke="#C7CCD4" stroke-width="1.2"/>
  <text x="1140" y="412" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F" text-anchor="middle">1000</text>
  <text x="1140" y="434" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F" text-anchor="end">droplet diameter, micrometres (log scale)</text>
  <rect x="60" y="452" width="520" height="146" rx="8" fill="#FAFBFC" stroke="#E3E6EB" stroke-width="1.2"/>
  <text x="88" y="484" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="bold" fill="#1F2933">At the hopper: fine and fast</text>
  <text x="88" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#3E4C59">Semi-enclosed, air above 10 m/s at the walls.</text>
  <text x="88" y="534" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#3E4C59">Air-assisted delivery carries 1-10 um droplets</text>
  <text x="88" y="556" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#3E4C59">into the flow instead of alongside it.</text>
  <text x="88" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#3E4C59">Lower water use; no product moisture penalty.</text>
  <rect x="620" y="452" width="520" height="146" rx="8" fill="#FAFBFC" stroke="#E3E6EB" stroke-width="1.2"/>
  <text x="648" y="484" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="bold" fill="#1F2933">At the stockpile: range and coverage</text>
  <text x="648" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#3E4C59">Open surface, wind-driven, emission scales with area.</text>
  <text x="648" y="534" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#3E4C59">JB/T 13562-2018 ties droplet size to throw:</text>
  <text x="648" y="556" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#3E4C59">30-50 m at &lt; 120 um, 200 m at &lt; 250 um.</text>
  <text x="648" y="578" font-family="Arial, Helvetica, sans-serif" font-size="12.8" fill="#3E4C59">One machine cannot be optimised for both duties.</text>
</svg>
