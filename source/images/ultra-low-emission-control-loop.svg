<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 470" width="1120" height="470" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1120" height="470" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Closed-Loop Control: Monitor, Identify, Grade, Trigger, Verify, Record</text>
  <text x="40" y="72" font-size="15" fill="#64748b">Replacement of timed spraying with event-driven suppression, one shift at a time</text>

  <!-- steps -->
  <rect x="60" y="120" width="150" height="130" rx="12" fill="#ecfdf5" stroke="#14b8a6" stroke-width="2"/>
  <text x="135" y="152" font-size="14" font-weight="700" fill="#134e4a" text-anchor="middle">1. Monitor</text>
  <text x="135" y="178" font-size="12" fill="#475569" text-anchor="middle">Camera + PM</text>
  <text x="135" y="196" font-size="12" fill="#475569" text-anchor="middle">+ weather</text>
  <text x="135" y="222" font-size="12" font-weight="600" fill="#0f766e" text-anchor="middle">监测</text>

  <path d="M210 185 L246 185" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#c)"/>

  <rect x="228" y="120" width="150" height="130" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="303" y="152" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">2. Identify</text>
  <text x="303" y="178" font-size="12" fill="#475569" text-anchor="middle">Dust plume or</text>
  <text x="303" y="196" font-size="12" fill="#475569" text-anchor="middle">dusty operation</text>
  <text x="303" y="222" font-size="12" font-weight="600" fill="#1d4ed8" text-anchor="middle">识别</text>

  <path d="M378 185 L414 185" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#c)"/>

  <rect x="396" y="120" width="150" height="130" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="471" y="152" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">3. Grade</text>
  <text x="471" y="178" font-size="12" fill="#475569" text-anchor="middle">Level I / II / III</text>
  <text x="471" y="196" font-size="12" fill="#475569" text-anchor="middle">by intensity</text>
  <text x="471" y="222" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">分级</text>

  <path d="M546 185 L582 185" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#c)"/>

  <rect x="564" y="120" width="150" height="130" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="639" y="152" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">4. Trigger</text>
  <text x="639" y="178" font-size="12" fill="#475569" text-anchor="middle">Only the zone</text>
  <text x="639" y="196" font-size="12" fill="#475569" text-anchor="middle">involved sprays</text>
  <text x="639" y="222" font-size="12" font-weight="600" fill="#7c3aed" text-anchor="middle">联动</text>

  <path d="M714 185 L750 185" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#c)"/>

  <rect x="732" y="120" width="150" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="807" y="152" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">5. Verify</text>
  <text x="807" y="178" font-size="12" fill="#475569" text-anchor="middle">Plume gone,</text>
  <text x="807" y="196" font-size="12" fill="#475569" text-anchor="middle">PM back to baseline</text>
  <text x="807" y="222" font-size="12" font-weight="600" fill="#b91c1c" text-anchor="middle">复核</text>

  <path d="M882 185 L918 185" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#c)"/>

  <rect x="900" y="120" width="150" height="130" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="975" y="152" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">6. Record</text>
  <text x="975" y="178" font-size="12" fill="#475569" text-anchor="middle">Image pair,</text>
  <text x="975" y="196" font-size="12" fill="#475569" text-anchor="middle">duration, water, power</text>
  <text x="975" y="222" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">留痕</text>

  <!-- feedback -->
  <path d="M975 250 L975 330 L135 330 L135 256" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#d)"/>
  <rect x="430" y="312" width="250" height="36" rx="8" fill="#ffffff"/>
  <text x="555" y="335" font-size="13" font-weight="600" fill="#0f766e" text-anchor="middle">Feedback: tune thresholds and presets</text>

  <!-- old vs new -->
  <rect x="60" y="368" width="480" height="80" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="80" y="396" font-size="14" font-weight="700" fill="#64748b">Timed spraying (old)</text>
  <text x="80" y="418" font-size="12.5" fill="#475569">Fixed schedule, whole yard runs, water and power wasted,</text>
  <text x="80" y="436" font-size="12.5" fill="#475569">still no evidence when the inspector asks.</text>

  <rect x="570" y="368" width="480" height="80" rx="10" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <text x="590" y="396" font-size="14" font-weight="700" fill="#134e4a">Event-driven suppression (new)</text>
  <text x="590" y="418" font-size="12.5" fill="#475569">Spray only when and where dust appears, every action</text>
  <text x="590" y="436" font-size="12.5" fill="#475569">logged with before and after images and PM readings.</text>

  <defs>
    <marker id="c" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="d" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
</svg>
