<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Four obligations in cement plant fugitive dust control, and the tool that settles each: area suppression, point suppression, carry-out control and the control layer">
  <rect width="1200" height="580" fill="#FAF7F5"/>
  <text x="30" y="46" font-size="25" font-weight="700" fill="#2B2622">Four obligations, and the tool that settles each</text>
  <text x="30" y="74" font-size="13.5" fill="#6B625C">The rulebooks ask four questions. Each one is answered by a different tool — and only one of the four is a decision about how much water goes into the air.</text>

  <!-- panel 1 : fog cannon -->
  <g>
    <rect x="30" y="104" width="270" height="440" rx="12" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="30" y="104" width="270" height="40" rx="12" fill="#A31F34"/>
    <rect x="30" y="132" width="270" height="12" fill="#A31F34"/>
    <text x="48" y="130" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">AREA SUPPRESSION</text>
    <g transform="translate(112,158)">
      <rect x="0" y="26" width="58" height="40" rx="6" fill="#F0E3E6" stroke="#A31F34" stroke-width="2"/>
      <polygon points="58,26 106,6 106,86 58,66" fill="#A31F34" opacity="0.85"/>
      <path d="M112 24 L158 10 M112 40 L162 34 M112 52 L162 58 M112 66 L158 82" stroke="#A31F34" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
    </g>
    <text x="165" y="284" font-size="17" font-weight="700" fill="#2B2622" text-anchor="middle">Fog cannon</text>
    <text x="165" y="318" font-size="11.5" fill="#4A423D" text-anchor="middle">Bringing a plume down across</text>
    <text x="165" y="335" font-size="11.5" fill="#4A423D" text-anchor="middle">open ground</text>
    <line x1="58" y1="360" x2="272" y2="360" stroke="#EDE5DF" stroke-width="2"/>
    <text x="58" y="386" font-size="11" fill="#8A807A">THE OBLIGATION</text>
    <text x="58" y="408" font-size="12.5" font-weight="600" fill="#2B2622">Open, coarse, wind-driven</text>
    <text x="58" y="444" font-size="11" fill="#8A807A">WHERE IT SITS IN THE RULEBOOK</text>
    <text x="58" y="466" font-size="12.5" fill="#2B2622">Named as watering of piles —</text>
    <text x="58" y="484" font-size="12.5" fill="#2B2622">one technique in the BAT list</text>
  </g>

  <!-- panel 2 : dry fog -->
  <g>
    <rect x="320" y="104" width="270" height="440" rx="12" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="320" y="104" width="270" height="40" rx="12" fill="#2E6F8E"/>
    <rect x="320" y="132" width="270" height="12" fill="#2E6F8E"/>
    <text x="338" y="130" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">POINT SUPPRESSION</text>
    <g transform="translate(402,158)">
      <rect x="0" y="26" width="46" height="40" rx="6" fill="#E1EBF1" stroke="#2E6F8E" stroke-width="2"/>
      <rect x="46" y="40" width="18" height="12" fill="#2E6F8E"/>
      <circle cx="80" cy="34" r="3" fill="#2E6F8E"/><circle cx="94" cy="46" r="3" fill="#2E6F8E"/>
      <circle cx="80" cy="58" r="3" fill="#2E6F8E"/><circle cx="98" cy="30" r="2.5" fill="#2E6F8E"/>
      <circle cx="100" cy="62" r="2.5" fill="#2E6F8E"/><circle cx="70" cy="46" r="2.5" fill="#2E6F8E"/>
    </g>
    <text x="455" y="284" font-size="17" font-weight="700" fill="#2B2622" text-anchor="middle">Dry fog</text>
    <text x="455" y="318" font-size="11.5" fill="#4A423D" text-anchor="middle">Locking a source down where</text>
    <text x="455" y="335" font-size="11.5" fill="#4A423D" text-anchor="middle">it starts</text>
    <line x1="348" y1="360" x2="562" y2="360" stroke="#EDE5DF" stroke-width="2"/>
    <text x="348" y="386" font-size="11" fill="#8A807A">THE OBLIGATION</text>
    <text x="348" y="408" font-size="12.5" font-weight="600" fill="#2B2622">Confined, fine, continuous</text>
    <text x="348" y="444" font-size="11" fill="#8A807A">WHERE IT SITS IN THE RULEBOOK</text>
    <text x="348" y="466" font-size="12.5" fill="#2B2622">Answers the enclosure and</text>
    <text x="348" y="484" font-size="12.5" fill="#2B2622">encapsulation clause</text>
  </g>

  <!-- panel 3 : wheel wash -->
  <g>
    <rect x="610" y="104" width="270" height="440" rx="12" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="610" y="104" width="270" height="40" rx="12" fill="#8A6A41"/>
    <rect x="610" y="132" width="270" height="12" fill="#8A6A41"/>
    <text x="628" y="130" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">CARRY-OUT CONTROL</text>
    <g transform="translate(684,158)">
      <circle cx="55" cy="62" r="33" fill="#F1EBE2" stroke="#8A6A41" stroke-width="2.5"/>
      <circle cx="55" cy="62" r="13" fill="#8A6A41" opacity="0.8"/>
      <rect x="0" y="38" width="12" height="48" rx="2" fill="#8A6A41" opacity="0.5"/>
      <rect x="100" y="38" width="12" height="48" rx="2" fill="#8A6A41" opacity="0.5"/>
      <path d="M22 42 L32 22 M55 38 L55 18 M88 42 L78 22" stroke="#2E6F8E" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="745" y="284" font-size="17" font-weight="700" fill="#2B2622" text-anchor="middle">Wheel wash</text>
    <text x="745" y="318" font-size="11.5" fill="#4A423D" text-anchor="middle">Stopping the dust that</text>
    <text x="745" y="335" font-size="11.5" fill="#4A423D" text-anchor="middle">leaves on wheels</text>
    <line x1="638" y1="360" x2="852" y2="360" stroke="#EDE5DF" stroke-width="2"/>
    <text x="638" y="386" font-size="11" fill="#8A807A">THE OBLIGATION</text>
    <text x="638" y="408" font-size="12.5" font-weight="600" fill="#2B2622">Vehicles at the site exit</text>
    <text x="638" y="444" font-size="11" fill="#8A807A">WHERE IT SITS IN THE RULEBOOK</text>
    <text x="638" y="466" font-size="12.5" fill="#2B2622">Named as wheel-cleaning</text>
    <text x="638" y="484" font-size="12.5" fill="#2B2622">equipment, and often required</text>
  </g>

  <!-- panel 4 : control layer -->
  <g>
    <rect x="900" y="104" width="270" height="440" rx="12" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="900" y="104" width="270" height="40" rx="12" fill="#3D5A6C"/>
    <rect x="900" y="132" width="270" height="12" fill="#3D5A6C"/>
    <text x="918" y="130" font-size="12" font-weight="700" fill="#ffffff" letter-spacing="1">THE CONTROL LAYER</text>
    <g transform="translate(975,158)">
      <circle cx="55" cy="55" r="26" fill="#E7EDF1" stroke="#3D5A6C" stroke-width="2.5"/>
      <circle cx="55" cy="55" r="7" fill="#3D5A6C"/>
      <circle cx="55" cy="16" r="9" fill="#3D5A6C" opacity="0.85"/>
      <circle cx="90" cy="74" r="9" fill="#3D5A6C" opacity="0.85"/>
      <circle cx="20" cy="74" r="9" fill="#3D5A6C" opacity="0.85"/>
      <path d="M55 25 L55 46 M82 71 L64 61 M28 71 L46 61" stroke="#3D5A6C" stroke-width="2" opacity="0.6"/>
    </g>
    <text x="1035" y="284" font-size="17" font-weight="700" fill="#2B2622" text-anchor="middle">Smart control</text>
    <text x="1035" y="318" font-size="11.5" fill="#4A423D" text-anchor="middle">Producing the evidence that</text>
    <text x="1035" y="335" font-size="11.5" fill="#4A423D" text-anchor="middle">the other three ran</text>
    <line x1="928" y1="360" x2="1142" y2="360" stroke="#EDE5DF" stroke-width="2"/>
    <text x="928" y="386" font-size="11" fill="#8A807A">THE OBLIGATION</text>
    <text x="928" y="408" font-size="12.5" font-weight="600" fill="#2B2622">Every zone, continuously</text>
    <text x="928" y="444" font-size="11" fill="#8A807A">WHERE IT SITS IN THE RULEBOOK</text>
    <text x="928" y="466" font-size="12.5" fill="#2B2622">Named as automatic devices</text>
    <text x="928" y="484" font-size="12.5" fill="#2B2622">and control systems</text>
  </g>
</svg>
