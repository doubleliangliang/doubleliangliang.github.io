<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Segoe UI, Arial, Helvetica, sans-serif" role="img" aria-label="Nine fugitive dust scenarios in a cement plant and the measure that matches each">
  <rect width="1200" height="800" fill="#FAF7F5"/>
  <text x="40" y="48" font-size="25" font-weight="700" fill="#2B2622">Fugitive dust scenarios in a cement plant, and what each one takes</text>
  <text x="40" y="76" font-size="13.5" fill="#6B625C">Grouped by the place and the operation that happens there. The plant resolves into nine scenarios, not ninety sources.</text>

  <!-- legend -->
  <g font-size="12" fill="#4A423D">
    <rect x="40" y="92" width="16" height="16" rx="3" fill="#A31F34"/>
    <text x="63" y="105">Fog cannon</text>
    <rect x="185" y="92" width="16" height="16" rx="3" fill="#2E6F8E"/>
    <text x="208" y="105">Dry fog</text>
    <rect x="300" y="92" width="16" height="16" rx="3" fill="#8A6A41"/>
    <text x="323" y="105">Enclosure and bag filtration</text>
    <rect x="545" y="92" width="16" height="16" rx="3" fill="#5F5F5F"/>
    <text x="568" y="105">Protection matched to the application</text>
  </g>

  <!-- ============ ROW 1 y=128 ============ -->
  <g>
    <rect x="40" y="128" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="40" y="128" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="40" y="150" width="360" height="12" fill="#F2EAE4"/>
    <text x="58" y="151" font-size="15" font-weight="700" fill="#2B2622">Quarry</text>
    <text x="58" y="192" font-size="11.5" fill="#4A423D">Drilling, blasting, loading and haul</text>
    <text x="58" y="209" font-size="11.5" fill="#4A423D">roads at the limestone face.</text>
    <rect x="58" y="278" width="324" height="32" rx="6" fill="#A31F34"/>
    <text x="72" y="299" font-size="11" font-weight="600" fill="#ffffff">Fog cannon</text>
  </g>
  <g>
    <rect x="420" y="128" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="420" y="128" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="420" y="150" width="360" height="12" fill="#F2EAE4"/>
    <text x="438" y="151" font-size="15" font-weight="700" fill="#2B2622">Crushing station</text>
    <text x="438" y="192" font-size="11.5" fill="#4A423D">Open tipping apron in front; hoods,</text>
    <text x="438" y="209" font-size="11.5" fill="#4A423D">screens and belt transfers behind it.</text>
    <rect x="438" y="278" width="158" height="32" rx="6" fill="#A31F34"/>
    <text x="452" y="299" font-size="11" font-weight="600" fill="#ffffff">Fog cannon, apron</text>
    <rect x="604" y="278" width="142" height="32" rx="6" fill="#2E6F8E"/>
    <text x="618" y="299" font-size="11" font-weight="600" fill="#ffffff">Dry fog, inside</text>
  </g>
  <g>
    <rect x="800" y="128" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="800" y="128" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="800" y="150" width="360" height="12" fill="#F2EAE4"/>
    <text x="818" y="151" font-size="15" font-weight="700" fill="#2B2622">Raw material and additive yards</text>
    <text x="818" y="192" font-size="11.5" fill="#4A423D">Stacking, reclaiming, hopper discharge,</text>
    <text x="818" y="209" font-size="11.5" fill="#4A423D">truck traffic and yard roads.</text>
    <rect x="818" y="278" width="324" height="32" rx="6" fill="#A31F34"/>
    <text x="832" y="299" font-size="11" font-weight="600" fill="#ffffff">Fog cannon</text>
  </g>

  <!-- ============ ROW 2 y=350 ============ -->
  <g>
    <rect x="40" y="350" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="40" y="350" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="40" y="372" width="360" height="12" fill="#F2EAE4"/>
    <text x="58" y="373" font-size="15" font-weight="700" fill="#2B2622">Raw meal preparation</text>
    <text x="58" y="414" font-size="11.5" fill="#4A423D">Mill feed and discharge, separator,</text>
    <text x="58" y="431" font-size="11.5" fill="#4A423D">silo top and filter discharge.</text>
    <rect x="58" y="500" width="324" height="32" rx="6" fill="#2E6F8E"/>
    <text x="72" y="521" font-size="11" font-weight="600" fill="#ffffff">Dry fog</text>
  </g>
  <g>
    <rect x="420" y="350" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="420" y="350" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="420" y="372" width="360" height="12" fill="#F2EAE4"/>
    <text x="438" y="373" font-size="15" font-weight="700" fill="#2B2622">Kiln line and cooler</text>
    <text x="438" y="414" font-size="11.5" fill="#4A423D">Preheater, rotary kiln and clinker cooler.</text>
    <text x="438" y="431" font-size="11.5" fill="#4A423D">A channelled, organised source.</text>
    <rect x="438" y="500" width="324" height="32" rx="6" fill="#8A6A41"/>
    <text x="452" y="521" font-size="11" font-weight="600" fill="#ffffff">Enclosure and bag filtration</text>
  </g>
  <g>
    <rect x="800" y="350" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="800" y="350" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="800" y="372" width="360" height="12" fill="#F2EAE4"/>
    <text x="818" y="373" font-size="15" font-weight="700" fill="#2B2622">Clinker storage and handling</text>
    <text x="818" y="414" font-size="11.5" fill="#4A423D">Silo discharge, stockpiles and belt</text>
    <text x="818" y="431" font-size="11.5" fill="#4A423D">transfers.</text>
    <rect x="818" y="500" width="158" height="32" rx="6" fill="#A31F34"/>
    <text x="832" y="521" font-size="11" font-weight="600" fill="#ffffff">Fog cannon</text>
    <rect x="984" y="500" width="158" height="32" rx="6" fill="#2E6F8E"/>
    <text x="998" y="521" font-size="11" font-weight="600" fill="#ffffff">Dry fog, transfers</text>
  </g>

  <!-- ============ ROW 3 y=572 ============ -->
  <g>
    <rect x="40" y="572" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="40" y="572" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="40" y="594" width="360" height="12" fill="#F2EAE4"/>
    <text x="58" y="595" font-size="15" font-weight="700" fill="#2B2622">Cement milling and dispatch</text>
    <text x="58" y="636" font-size="11.5" fill="#4A423D">Cement mill, cement silos, packers and</text>
    <text x="58" y="653" font-size="11.5" fill="#4A423D">bulk and bag loading heads.</text>
    <rect x="58" y="722" width="324" height="32" rx="6" fill="#8A6A41"/>
    <text x="72" y="743" font-size="11" font-weight="600" fill="#ffffff">No spray: enclosure, negative pressure</text>
  </g>
  <g>
    <rect x="420" y="572" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="420" y="572" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="420" y="594" width="360" height="12" fill="#F2EAE4"/>
    <text x="438" y="595" font-size="15" font-weight="700" fill="#2B2622">Coal preparation</text>
    <text x="438" y="636" font-size="11.5" fill="#4A423D">Coal yard, coal mill, coal silo and coal</text>
    <text x="438" y="653" font-size="11.5" fill="#4A423D">transport.</text>
    <rect x="438" y="722" width="158" height="32" rx="6" fill="#A31F34"/>
    <text x="452" y="743" font-size="11" font-weight="600" fill="#ffffff">Fog cannon, yard</text>
    <rect x="604" y="722" width="142" height="32" rx="6" fill="#5F5F5F"/>
    <text x="618" y="743" font-size="11" font-weight="600" fill="#ffffff">Protection-matched</text>
  </g>
  <g>
    <rect x="800" y="572" width="360" height="200" rx="10" fill="#ffffff" stroke="#E4DCD6"/>
    <rect x="800" y="572" width="360" height="34" rx="10" fill="#F2EAE4"/>
    <rect x="800" y="594" width="360" height="12" fill="#F2EAE4"/>
    <text x="818" y="595" font-size="15" font-weight="700" fill="#2B2622">Plant and haul roads</text>
    <text x="818" y="636" font-size="11.5" fill="#4A423D">Re-entrained dust under repeated</text>
    <text x="818" y="653" font-size="11.5" fill="#4A423D">vehicle traffic.</text>
    <rect x="818" y="722" width="324" height="32" rx="6" fill="#A31F34"/>
    <text x="832" y="743" font-size="11" font-weight="600" fill="#ffffff">Fog cannon plus mechanical sweeping</text>
  </g>
</svg>
