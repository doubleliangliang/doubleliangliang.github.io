<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="770" fill="#ffffff"/>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#1A1A1A">Cement Plant Dust Sources by Scenario</text>
  <text x="40" y="76" font-size="13.5" fill="#6B6B6B">One location and one set of operations makes one scenario. These are the scenarios that need suppression, and each one maps to a single measure.</text>

  <rect x="40" y="95" width="12" height="12" rx="3" fill="#A31F34"/>
  <text x="60" y="106" font-size="12.5" fill="#4A3A3E">Fog cannon</text>
  <rect x="162" y="95" width="12" height="12" rx="3" fill="#2E6F8E"/>
  <text x="182" y="106" font-size="12.5" fill="#4A3A3E">Dry fog</text>
  <rect x="268" y="95" width="12" height="12" rx="3" fill="#8A6A41"/>
  <text x="288" y="106" font-size="12.5" fill="#4A3A3E">Not a spray job — enclosure, negative pressure and bag filtration</text>
  <rect x="760" y="95" width="12" height="12" rx="3" fill="#5F5F5F"/>
  <text x="780" y="106" font-size="12.5" fill="#4A3A3E">Protection matched to the application</text>

  <defs>
    <marker id="arwe" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#C4C4C4"/>
    </marker>
    <marker id="arwed" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#DADADA"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="40" y="132" width="265" height="212" rx="12" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.5"/>
  <rect x="40" y="132" width="5" height="212" rx="2.5" fill="#A31F34"/>
  <text x="62" y="164" font-size="15" font-weight="700" fill="#A31F34">1  Quarry</text>
  <text x="62" y="194" font-size="11" fill="#4A3A3E">Drilling, blasting, loading</text>
  <text x="62" y="213" font-size="11" fill="#4A3A3E">Haul roads</text>
  <text x="62" y="245" font-size="12.5" font-weight="700" fill="#A31F34">Fog cannon</text>
  <text x="62" y="275" font-size="11" fill="#7A5A62">A large area worked</text>
  <text x="62" y="294" font-size="11" fill="#7A5A62">intermittently: reach and</text>
  <text x="62" y="313" font-size="11" fill="#7A5A62">coverage, plus road sweeping.</text>

  <rect x="325" y="132" width="265" height="212" rx="12" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.5"/>
  <rect x="325" y="132" width="5" height="212" rx="2.5" fill="#A31F34"/>
  <text x="347" y="164" font-size="15" font-weight="700" fill="#A31F34">2  Crushing station</text>
  <text x="347" y="194" font-size="11" fill="#4A3A3E">Tipping, crushing</text>
  <text x="347" y="213" font-size="11" fill="#4A3A3E">Screening, belt transfer</text>
  <text x="347" y="245" font-size="11.5" font-weight="700" fill="#A31F34">Fog cannon: open tipping apron</text>
  <text x="347" y="266" font-size="11.5" font-weight="700" fill="#2E6F8E">Dry fog: enclosed crushing and transfer</text>
  <text x="347" y="294" font-size="11" fill="#7A5A62">Hood and chute first — the</text>
  <text x="347" y="313" font-size="11" fill="#7A5A62">cannon finishes the job.</text>

  <rect x="610" y="132" width="265" height="212" rx="12" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.5"/>
  <rect x="610" y="132" width="5" height="212" rx="2.5" fill="#A31F34"/>
  <text x="632" y="164" font-size="15" font-weight="700" fill="#A31F34">3  Raw and additive yards</text>
  <text x="632" y="194" font-size="11" fill="#4A3A3E">Stacking, reclaiming, discharge</text>
  <text x="632" y="213" font-size="11" fill="#4A3A3E">Truck traffic, yard roads</text>
  <text x="632" y="245" font-size="12.5" font-weight="700" fill="#A31F34">Fog cannon</text>
  <text x="632" y="275" font-size="11" fill="#7A5A62">Wide, low plume, wind-</text>
  <text x="632" y="294" font-size="11" fill="#7A5A62">driven; seal what can be sealed.</text>

  <rect x="895" y="132" width="265" height="212" rx="12" fill="#EFF5F9" stroke="#CFE0EA" stroke-width="1.5"/>
  <rect x="895" y="132" width="5" height="212" rx="2.5" fill="#2E6F8E"/>
  <text x="917" y="164" font-size="15" font-weight="700" fill="#2E6F8E">4  Raw meal preparation</text>
  <text x="917" y="194" font-size="11" fill="#28566E">Mill feed and discharge, separator</text>
  <text x="917" y="213" font-size="11" fill="#28566E">Silo top, filter discharge</text>
  <text x="917" y="245" font-size="12.5" font-weight="700" fill="#2E6F8E">Dry fog</text>
  <text x="917" y="275" font-size="11" fill="#3E7290">Needs an enclosed space;</text>
  <text x="917" y="294" font-size="11" fill="#3E7290">moisture added in fractions of a percent.</text>

  <line x1="309" y1="238" x2="321" y2="238" stroke="#C4C4C4" stroke-width="2" marker-end="url(#arwe)"/>
  <line x1="594" y1="238" x2="606" y2="238" stroke="#C4C4C4" stroke-width="2" marker-end="url(#arwe)"/>
  <line x1="879" y1="238" x2="891" y2="238" stroke="#C4C4C4" stroke-width="2" marker-end="url(#arwe)"/>

  <path d="M1027,344 L1027,362 L172,362 L172,376" fill="none" stroke="#DADADA" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arwed)"/>

  <!-- Row 2 -->
  <rect x="40" y="386" width="265" height="212" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <rect x="40" y="386" width="5" height="212" rx="2.5" fill="#8A6A41"/>
  <text x="62" y="418" font-size="15" font-weight="700" fill="#8A6A41">5  Kiln line and cooler</text>
  <text x="62" y="448" font-size="11" fill="#5C4629">Preheater, rotary kiln</text>
  <text x="62" y="467" font-size="11" fill="#5C4629">Clinker cooling, kiln baghouse</text>
  <text x="62" y="499" font-size="12.5" font-weight="700" fill="#8A6A41">Not a spray job</text>
  <text x="62" y="529" font-size="11" fill="#6F5734">An organised source —</text>
  <text x="62" y="548" font-size="11" fill="#6F5734">handled by bag filtration.</text>

  <rect x="325" y="386" width="265" height="212" rx="12" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.5"/>
  <rect x="325" y="386" width="5" height="212" rx="2.5" fill="#A31F34"/>
  <text x="347" y="418" font-size="15" font-weight="700" fill="#A31F34">6  Clinker storage</text>
  <text x="347" y="448" font-size="11" fill="#4A3A3E">Clinker silo, clinker stockpile</text>
  <text x="347" y="467" font-size="11" fill="#4A3A3E">Clinker transfer, belts</text>
  <text x="347" y="499" font-size="11.5" font-weight="700" fill="#A31F34">Fog cannon: silo discharge and piles</text>
  <text x="347" y="520" font-size="11.5" font-weight="700" fill="#2E6F8E">Dry fog: enclosed transfer points</text>
  <text x="347" y="548" font-size="11" fill="#7A5A62">Coarse, hot and abrasive.</text>

  <rect x="610" y="386" width="265" height="212" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <rect x="610" y="386" width="5" height="212" rx="2.5" fill="#8A6A41"/>
  <text x="632" y="418" font-size="15" font-weight="700" fill="#8A6A41">7  Cement milling and dispatch</text>
  <text x="632" y="448" font-size="11" fill="#5C4629">Cement mill, cement silos</text>
  <text x="632" y="467" font-size="11" fill="#5C4629">Packers, loading heads</text>
  <text x="632" y="499" font-size="12.5" font-weight="700" fill="#8A6A41">Not a spray job</text>
  <text x="632" y="529" font-size="11" fill="#6F5734">The product hydrates on</text>
  <text x="632" y="548" font-size="11" fill="#6F5734">contact (below 0.5%):</text>
  <text x="632" y="567" font-size="11" fill="#6F5734">enclosure and extraction.</text>

  <rect x="895" y="386" width="265" height="212" rx="12" fill="#F4F4F4" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="895" y="386" width="5" height="212" rx="2.5" fill="#5F5F5F"/>
  <text x="917" y="418" font-size="15" font-weight="700" fill="#4A4A4A">8  Coal preparation</text>
  <text x="917" y="448" font-size="11" fill="#4A4A4A">Coal yard, coal mill</text>
  <text x="917" y="467" font-size="11" fill="#4A4A4A">Coal silo, coal transport</text>
  <text x="917" y="499" font-size="12.5" font-weight="700" fill="#A31F34">Fog cannon: coal yard</text>
  <text x="917" y="520" font-size="12.5" font-weight="700" fill="#5F5F5F">Ex configuration: coal system</text>
  <text x="917" y="548" font-size="11" fill="#5A5A5A">A suspended coal cloud is the</text>
  <text x="917" y="567" font-size="11" fill="#5A5A5A">hazard; never use compressed air.</text>

  <line x1="309" y1="492" x2="321" y2="492" stroke="#C4C4C4" stroke-width="2" marker-end="url(#arwe)"/>
  <line x1="594" y1="492" x2="606" y2="492" stroke="#C4C4C4" stroke-width="2" marker-end="url(#arwe)"/>
  <line x1="879" y1="492" x2="891" y2="492" stroke="#C4C4C4" stroke-width="2" marker-end="url(#arwe)"/>

  <rect x="40" y="630" width="1120" height="104" rx="12" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.5"/>
  <rect x="40" y="630" width="5" height="104" rx="2.5" fill="#A31F34"/>
  <text x="62" y="662" font-size="15" font-weight="700" fill="#A31F34">9  Plant roads and haul roads</text>
  <text x="380" y="662" font-size="11.5" fill="#4A3A3E">Re-entrained dust under repeated vehicle traffic, across the whole site.</text>
  <text x="62" y="692" font-size="12.5" font-weight="700" fill="#A31F34">Fog cannon + mechanical sweeping</text>
  <text x="380" y="692" font-size="11.5" fill="#7A5A62">Pressing dust down without sweeping it away puts it back in the air.</text>
  <text x="62" y="718" font-size="11" fill="#8A8A8A">Beyond these nine, the enclosed points on transfer towers, silo tops and filter discharge can be assessed on the same dry-fog logic.</text>
</svg>
