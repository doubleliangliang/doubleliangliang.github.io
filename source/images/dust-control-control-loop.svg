<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#1F1F23">From a Timer to a Control Loop</text>
  <text x="40" y="74" font-size="13.5" fill="#606068">A fixed schedule sprays the same amount whether the yard is working or empty. A loop responds to events and leaves a record.</text>

  <!-- boxes -->
  <g>
    <rect x="35" y="112" width="170" height="118" rx="9" fill="#FDF6F7" stroke="#EBD3D8"/>
    <rect x="35" y="112" width="170" height="5" rx="2.5" fill="#A31F34"/>
    <text x="120" y="146" font-size="13" font-weight="700" fill="#A31F34" text-anchor="middle">MONITOR</text>
    <text x="120" y="174" font-size="11" fill="#4A4A50" text-anchor="middle">PM10, PM2.5, wind</text>
    <text x="120" y="192" font-size="11" fill="#4A4A50" text-anchor="middle">speed and direction,</text>
    <text x="120" y="210" font-size="11" fill="#4A4A50" text-anchor="middle">cameras at each zone</text>
  </g>

  <rect x="227" y="112" width="170" height="118" rx="9" fill="#FDF6F7" stroke="#EBD3D8"/>
  <rect x="227" y="112" width="170" height="5" rx="2.5" fill="#A31F34"/>
  <text x="312" y="146" font-size="13" font-weight="700" fill="#A31F34" text-anchor="middle">IDENTIFY</text>
  <text x="312" y="174" font-size="11" fill="#4A4A50" text-anchor="middle">Which source is driving</text>
  <text x="312" y="192" font-size="11" fill="#4A4A50" text-anchor="middle">the reading, and is it</text>
  <text x="312" y="210" font-size="11" fill="#4A4A50" text-anchor="middle">dust or steam</text>

  <rect x="419" y="112" width="170" height="118" rx="9" fill="#FDF6F7" stroke="#EBD3D8"/>
  <rect x="419" y="112" width="170" height="5" rx="2.5" fill="#A31F34"/>
  <text x="504" y="146" font-size="13" font-weight="700" fill="#A31F34" text-anchor="middle">GRADE</text>
  <text x="504" y="174" font-size="11" fill="#4A4A50" text-anchor="middle">Compare against the</text>
  <text x="504" y="192" font-size="11" fill="#4A4A50" text-anchor="middle">threshold set for this</text>
  <text x="504" y="210" font-size="11" fill="#4A4A50" text-anchor="middle">zone, not a site average</text>

  <rect x="611" y="112" width="170" height="118" rx="9" fill="#FDF6F7" stroke="#EBD3D8"/>
  <rect x="611" y="112" width="170" height="5" rx="2.5" fill="#A31F34"/>
  <text x="696" y="146" font-size="13" font-weight="700" fill="#A31F34" text-anchor="middle">TRIGGER</text>
  <text x="696" y="174" font-size="11" fill="#4A4A50" text-anchor="middle">Start the right device,</text>
  <text x="696" y="192" font-size="11" fill="#4A4A50" text-anchor="middle">at the right intensity,</text>
  <text x="696" y="210" font-size="11" fill="#4A4A50" text-anchor="middle">with wind compensation</text>

  <rect x="803" y="112" width="170" height="118" rx="9" fill="#FDF6F7" stroke="#EBD3D8"/>
  <rect x="803" y="112" width="170" height="5" rx="2.5" fill="#A31F34"/>
  <text x="888" y="146" font-size="13" font-weight="700" fill="#A31F34" text-anchor="middle">VERIFY</text>
  <text x="888" y="174" font-size="11" fill="#4A4A50" text-anchor="middle">Confirm the event</text>
  <text x="888" y="192" font-size="11" fill="#4A4A50" text-anchor="middle">actually subsided, and</text>
  <text x="888" y="210" font-size="11" fill="#4A4A50" text-anchor="middle">flag the ones that did not</text>

  <rect x="995" y="112" width="170" height="118" rx="9" fill="#FDF6F7" stroke="#EBD3D8"/>
  <rect x="995" y="112" width="170" height="5" rx="2.5" fill="#A31F34"/>
  <text x="1080" y="146" font-size="13" font-weight="700" fill="#A31F34" text-anchor="middle">RECORD</text>
  <text x="1080" y="174" font-size="11" fill="#4A4A50" text-anchor="middle">Per-zone water, energy</text>
  <text x="1080" y="192" font-size="11" fill="#4A4A50" text-anchor="middle">and event history that</text>
  <text x="1080" y="210" font-size="11" fill="#4A4A50" text-anchor="middle">survives a review</text>

  <!-- arrows between boxes -->
  <g fill="#A31F34">
    <path d="M205 171 L221 171 L221 166 L227 171 L221 176 L221 171 Z"/>
  </g>
  <g fill="#A31F34">
    <path d="M397 171 L413 171 L413 166 L419 171 L413 176 L413 171 Z"/>
  </g>
  <g fill="#A31F34">
    <path d="M589 171 L605 171 L605 166 L611 171 L605 176 L605 171 Z"/>
  </g>
  <g fill="#A31F34">
    <path d="M781 171 L797 171 L797 166 L803 171 L797 176 L797 171 Z"/>
  </g>
  <g fill="#A31F34">
    <path d="M973 171 L989 171 L989 166 L995 171 L989 176 L989 171 Z"/>
  </g>

  <!-- return loop -->
  <path d="M1080 230 L1080 280 L120 280 L120 236" fill="none" stroke="#C9C9D0" stroke-width="1.6" stroke-dasharray="6 5"/>
  <path d="M120 242 L115 252 L125 252 Z" fill="#C9C9D0"/>
  <text x="600" y="272" font-size="11" fill="#808088" text-anchor="middle">continuous, not a fixed schedule</text>

  <!-- KPI panel -->
  <rect x="35" y="308" width="1130" height="96" rx="10" fill="#FAF7F2" stroke="#E6DCCD"/>
  <rect x="35" y="308" width="6" height="96" rx="3" fill="#8A6A41"/>
  <text x="66" y="342" font-size="11" font-weight="700" fill="#8A6A41" letter-spacing="1.5">THE KPI WORTH PUTTING ON THE WALL</text>
  <text x="66" y="374" font-size="18" font-weight="700" fill="#1F1F23">Visible dust-escape events per week, per zone</text>
  <text x="66" y="394" font-size="11.5" fill="#4A4A50">A number an operations manager can act on, a community liaison officer can report, and — where an opacity limit applies — a direct match to the regulatory criterion.</text>

  <!-- two hard requirements -->
  <rect x="35" y="422" width="557" height="76" rx="9" fill="#F7F7F9" stroke="#DEDEE4"/>
  <text x="59" y="450" font-size="12" font-weight="700" fill="#1F1F23">Separate dust from steam</text>
  <text x="59" y="472" font-size="11.5" fill="#4A4A50">Visible-emission rules exempt uncombined water, so mist over hot material looks</text>
  <text x="59" y="489" font-size="11.5" fill="#4A4A50">like dust. Get this wrong and operators will mute the system, rightly.</text>

  <rect x="608" y="422" width="557" height="76" rx="9" fill="#F7F7F9" stroke="#DEDEE4"/>
  <text x="632" y="450" font-size="12" font-weight="700" fill="#1F1F23">Thresholds per zone</text>
  <text x="632" y="472" font-size="11.5" fill="#4A4A50">A stockyard alarm level means nothing at a transfer tower. Commissioning on</text>
  <text x="632" y="489" font-size="11.5" fill="#4A4A50">site is how thresholds get set, and it belongs in the scope.</text>
</svg>
