<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="700" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#1A1A1A">Cement Plant Dust Sources by Behaviour</text>
  <text x="40" y="76" font-size="14" fill="#6B6B6B">Four families that behave nothing alike. One measure applied across the whole site is guaranteed to be wrong somewhere.</text>

  <!-- ================= COLUMN A ================= -->
  <rect x="40" y="104" width="256" height="468" rx="12" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="1.5"/>
  <rect x="40" y="104" width="256" height="6" rx="3" fill="#A31F34"/>
  <text x="58" y="140" font-size="15" font-weight="700" fill="#A31F34" letter-spacing="1">OPEN &amp; COARSE</text>
  <line x1="58" y1="155" x2="278" y2="155" stroke="#EFEFEF" stroke-width="1"/>
  <text x="58" y="177" font-size="10" fill="#9A9A9A" letter-spacing="1.3">DUST CHARACTER</text>
  <text x="58" y="198" font-size="12.5" fill="#3C3C3C">Coarse particles in large open</text>
  <text x="58" y="215" font-size="12.5" fill="#3C3C3C">areas, driven by wind and</text>
  <text x="58" y="232" font-size="12.5" fill="#3C3C3C">vehicle traffic.</text>
  <line x1="58" y1="254" x2="278" y2="254" stroke="#EFEFEF" stroke-width="1"/>
  <text x="58" y="276" font-size="10" fill="#9A9A9A" letter-spacing="1.3">TYPICAL SOURCES</text>
  <text x="58" y="297" font-size="12.5" fill="#3C3C3C">• Limestone quarry: drilling,</text>
  <text x="58" y="314" font-size="12.5" fill="#6B6B6B">&#160;&#160;blasting, loading, hauling</text>
  <text x="58" y="331" font-size="12.5" fill="#3C3C3C">• Crushing station apron</text>
  <text x="58" y="348" font-size="12.5" fill="#3C3C3C">• Pre-homogenising yard and</text>
  <text x="58" y="365" font-size="12.5" fill="#6B6B6B">&#160;&#160;clinker stockpile area</text>
  <text x="58" y="382" font-size="12.5" fill="#3C3C3C">• Haul roads and plant roads</text>
  <line x1="58" y1="404" x2="278" y2="404" stroke="#EFEFEF" stroke-width="1"/>
  <text x="58" y="426" font-size="10" fill="#9A9A9A" letter-spacing="1.3">RECOMMENDED MEASURE</text>
  <text x="58" y="447" font-size="12.5" font-weight="700" fill="#3C3C3C">Fog cannon, 30–300 m reach</text>
  <text x="58" y="464" font-size="12.5" fill="#3C3C3C">Wind-aware presets; road</text>
  <text x="58" y="481" font-size="12.5" fill="#3C3C3C">hardening plus sweeping.</text>
  <rect x="58" y="500" width="220" height="56" rx="7" fill="#FDF3F5"/>
  <text x="70" y="520" font-size="11.5" fill="#7A3543">Water is harmless at these</text>
  <text x="70" y="536" font-size="11.5" fill="#7A3543">sources: the material is ground</text>
  <text x="70" y="552" font-size="11.5" fill="#7A3543">and burned anyway.</text>

  <!-- ================= COLUMN B ================= -->
  <rect x="328" y="104" width="256" height="468" rx="12" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="1.5"/>
  <rect x="328" y="104" width="256" height="6" rx="3" fill="#2E6F8E"/>
  <text x="346" y="140" font-size="15" font-weight="700" fill="#2E6F8E" letter-spacing="1">ENCLOSED &amp; FINE</text>
  <line x1="346" y1="155" x2="566" y2="155" stroke="#EFEFEF" stroke-width="1"/>
  <text x="346" y="177" font-size="10" fill="#9A9A9A" letter-spacing="1.3">DUST CHARACTER</text>
  <text x="346" y="198" font-size="12.5" fill="#3C3C3C">Extremely fine, sticky and</text>
  <text x="346" y="215" font-size="12.5" fill="#3C3C3C">easily re-entrained; it builds</text>
  <text x="346" y="232" font-size="12.5" fill="#3C3C3C">up on walls and steelwork.</text>
  <line x1="346" y1="254" x2="566" y2="254" stroke="#EFEFEF" stroke-width="1"/>
  <text x="346" y="276" font-size="10" fill="#9A9A9A" letter-spacing="1.3">TYPICAL SOURCES</text>
  <text x="346" y="297" font-size="12.5" fill="#3C3C3C">• Belt transfer points</text>
  <text x="346" y="314" font-size="12.5" fill="#3C3C3C">• Bucket elevators</text>
  <text x="346" y="331" font-size="12.5" fill="#3C3C3C">• Raw meal silo top</text>
  <text x="346" y="348" font-size="12.5" fill="#3C3C3C">• Mill feed and discharge</text>
  <text x="346" y="365" font-size="12.5" fill="#3C3C3C">• Bunker and chute outlets</text>
  <text x="346" y="382" font-size="12.5" fill="#3C3C3C">• Airslide and screw conveyors</text>
  <line x1="346" y1="404" x2="566" y2="404" stroke="#EFEFEF" stroke-width="1"/>
  <text x="346" y="426" font-size="10" fill="#9A9A9A" letter-spacing="1.3">RECOMMENDED MEASURE</text>
  <text x="346" y="447" font-size="12.5" font-weight="700" fill="#3C3C3C">Dry fog, droplets of 1–10 µm</text>
  <text x="346" y="464" font-size="12.5" fill="#3C3C3C">Air-atomised mist that evaporates</text>
  <text x="346" y="481" font-size="12.5" fill="#3C3C3C">in the stream. Needs containment.</text>
  <rect x="346" y="500" width="220" height="56" rx="7" fill="#EFF5F9"/>
  <text x="358" y="520" font-size="11.5" fill="#28566E">Added moisture stays below a</text>
  <text x="358" y="536" font-size="11.5" fill="#28566E">fraction of one percent, so the</text>
  <text x="358" y="552" font-size="11.5" fill="#28566E">product is never wetted.</text>

  <!-- ================= COLUMN C ================= -->
  <rect x="616" y="104" width="256" height="468" rx="12" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="1.5"/>
  <rect x="616" y="104" width="256" height="6" rx="3" fill="#8A6A41"/>
  <text x="634" y="140" font-size="15" font-weight="700" fill="#8A6A41" letter-spacing="1">PRODUCT CEMENT</text>
  <line x1="634" y1="155" x2="854" y2="155" stroke="#EFEFEF" stroke-width="1"/>
  <text x="634" y="177" font-size="10" fill="#9A9A9A" letter-spacing="1.3">DUST CHARACTER</text>
  <text x="634" y="198" font-size="12.5" fill="#3C3C3C">Sub-10 µm product dust that</text>
  <text x="634" y="215" font-size="12.5" fill="#3C3C3C">hydrates and sets on contact</text>
  <text x="634" y="232" font-size="12.5" fill="#3C3C3C">with water.</text>
  <line x1="634" y1="254" x2="854" y2="254" stroke="#EFEFEF" stroke-width="1"/>
  <text x="634" y="276" font-size="10" fill="#9A9A9A" letter-spacing="1.3">TYPICAL SOURCES</text>
  <text x="634" y="297" font-size="12.5" fill="#3C3C3C">• Cement mill and separator</text>
  <text x="634" y="314" font-size="12.5" fill="#3C3C3C">• Cement silo and airslide</text>
  <text x="634" y="331" font-size="12.5" fill="#3C3C3C">• Packing machine and spouts</text>
  <text x="634" y="348" font-size="12.5" fill="#3C3C3C">• Bulk loading heads</text>
  <text x="634" y="365" font-size="12.5" fill="#3C3C3C">• Weighbridge and dispatch area</text>
  <line x1="634" y1="404" x2="854" y2="404" stroke="#EFEFEF" stroke-width="1"/>
  <text x="634" y="426" font-size="10" fill="#9A9A9A" letter-spacing="1.3">RECOMMENDED MEASURE</text>
  <text x="634" y="447" font-size="12.5" font-weight="700" fill="#3C3C3C">Enclosure + extraction</text>
  <text x="634" y="464" font-size="12.5" fill="#3C3C3C">Sealed hoods under negative</text>
  <text x="634" y="481" font-size="12.5" fill="#3C3C3C">pressure; micro-mist at the spout.</text>
  <rect x="634" y="500" width="220" height="56" rx="7" fill="#FAF4EC"/>
  <text x="646" y="520" font-size="11.5" fill="#6B5233">Water downstream of the mill is</text>
  <text x="646" y="536" font-size="11.5" fill="#6B5233">pre-hydration: caking, blocked</text>
  <text x="646" y="552" font-size="11.5" fill="#6B5233">chutes, lost strength.</text>

  <!-- ================= COLUMN D ================= -->
  <rect x="904" y="104" width="256" height="468" rx="12" fill="#FFFFFF" stroke="#E3E3E3" stroke-width="1.5"/>
  <rect x="904" y="104" width="256" height="6" rx="3" fill="#5F5F5F"/>
  <text x="922" y="140" font-size="15" font-weight="700" fill="#5F5F5F" letter-spacing="1">COMBUSTIBLE</text>
  <line x1="922" y1="155" x2="1142" y2="155" stroke="#EFEFEF" stroke-width="1"/>
  <text x="922" y="177" font-size="10" fill="#9A9A9A" letter-spacing="1.3">DUST CHARACTER</text>
  <text x="922" y="198" font-size="12.5" fill="#3C3C3C">Coal dust. The suspended cloud</text>
  <text x="922" y="215" font-size="12.5" fill="#3C3C3C">is the hazard itself, not just an</text>
  <text x="922" y="232" font-size="12.5" fill="#3C3C3C">emission to knock down.</text>
  <line x1="922" y1="254" x2="1142" y2="254" stroke="#EFEFEF" stroke-width="1"/>
  <text x="922" y="276" font-size="10" fill="#9A9A9A" letter-spacing="1.3">TYPICAL SOURCES</text>
  <text x="922" y="297" font-size="12.5" fill="#3C3C3C">• Coal storage yard</text>
  <text x="922" y="314" font-size="12.5" fill="#3C3C3C">• Coal mill and classifier</text>
  <text x="922" y="331" font-size="12.5" fill="#3C3C3C">• Coal silo, feeder and</text>
  <text x="922" y="348" font-size="12.5" fill="#6B6B6B">&#160;&#160;kiln firing line</text>
  <line x1="922" y1="404" x2="1142" y2="404" stroke="#EFEFEF" stroke-width="1"/>
  <text x="922" y="426" font-size="10" fill="#9A9A9A" letter-spacing="1.3">RECOMMENDED MEASURE</text>
  <text x="922" y="447" font-size="12.5" font-weight="700" fill="#3C3C3C">Protection + housekeeping</text>
  <text x="922" y="464" font-size="12.5" fill="#3C3C3C">Wet or vacuum cleaning, layer</text>
  <text x="922" y="481" font-size="12.5" fill="#3C3C3C">control, CO and heat monitoring.</text>
  <rect x="922" y="500" width="220" height="56" rx="7" fill="#F4F4F4"/>
  <text x="934" y="520" font-size="11.5" fill="#4A4A4A">Never air-blast or sweep dry:</text>
  <text x="934" y="536" font-size="11.5" fill="#4A4A4A">that creates the very cloud that</text>
  <text x="934" y="552" font-size="11.5" fill="#4A4A4A">makes the hazard.</text>

  <!-- ================= BOTTOM BAND ================= -->
  <rect x="40" y="592" width="1120" height="72" rx="10" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.5"/>
  <text x="60" y="620" font-size="12" font-weight="700" fill="#A31F34" letter-spacing="1.2">ORGANISED SOURCE — KILN, PREHEATER AND WASTE-HEAT RECOVERY</text>
  <text x="60" y="644" font-size="12.5" fill="#4A3A3E">High temperature, fine and always in motion, with strong buoyancy. This is not a spray problem: capture at the hood and bag filtration do the work.</text>
</svg>
