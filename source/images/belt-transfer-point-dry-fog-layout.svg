<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Anatomy of a Belt Transfer Point with Dry Fog Suppression</text>
  <text x="40" y="72" font-size="15" fill="#64748b">The decisive point is the impact zone: dust is generated inside the chute, so that is where the nozzle has to be</text>

  <!-- upper conveyor -->
  <line x1="70" y1="150" x2="360" y2="150" stroke="#475569" stroke-width="6"/>
  <circle cx="80" cy="150" r="14" fill="none" stroke="#475569" stroke-width="4"/>
  <circle cx="350" cy="150" r="14" fill="none" stroke="#475569" stroke-width="4"/>
  <text x="210" y="132" font-size="13" fill="#475569" text-anchor="middle">Feed belt</text>

  <!-- drop chute -->
  <path d="M 356 162 L 470 168 L 500 300 L 430 300 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="452" y="240" font-size="12.5" fill="#334155" text-anchor="middle">Drop</text>
  <text x="452" y="256" font-size="12.5" fill="#334155" text-anchor="middle">chute</text>

  <!-- damping plate -->
  <line x1="452" y1="196" x2="492" y2="236" stroke="#0d9488" stroke-width="5" stroke-linecap="round"/>
  <text x="560" y="200" font-size="12.5" font-weight="700" fill="#0d9488">Damping plate</text>
  <text x="560" y="216" font-size="12" fill="#64748b">cuts the positive</text>
  <text x="560" y="232" font-size="12" fill="#64748b">pressure puff</text>
  <line x1="500" y1="210" x2="556" y2="204" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- receiving belt -->
  <line x1="230" y1="410" x2="940" y2="410" stroke="#475569" stroke-width="6"/>
  <circle cx="240" cy="410" r="14" fill="none" stroke="#475569" stroke-width="4"/>
  <circle cx="930" cy="410" r="14" fill="none" stroke="#475569" stroke-width="4"/>
  <text x="860" y="440" font-size="13" fill="#475569" text-anchor="middle">Receiving belt</text>

  <!-- guide chute enclosure -->
  <rect x="398" y="286" width="430" height="104" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="613" y="278" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Sealed guide chute (transfer enclosure)</text>

  <!-- coal on belt -->
  <path d="M 470 400 Q 505 360 540 400 Z" fill="#475569" opacity="0.55"/>
  <path d="M 540 400 Q 575 358 610 400 Z" fill="#475569" opacity="0.45"/>
  <path d="M 610 400 Q 645 362 680 400 Z" fill="#475569" opacity="0.35"/>
  <text x="600" y="424" font-size="12" fill="#64748b" text-anchor="middle">Coal stream</text>

  <!-- dust puff inside -->
  <g fill="#94a3b8" opacity="0.5">
    <circle cx="500" cy="330" r="16"/>
    <circle cx="524" cy="312" r="12"/>
    <circle cx="482" cy="308" r="10"/>
    <circle cx="512" cy="342" r="9"/>
  </g>
  <text x="500" y="378" font-size="12" fill="#64748b" text-anchor="middle">Impact dust</text>

  <!-- dry fog nozzles -->
  <g>
    <polygon points="430,300 424,314 436,314" fill="#0d9488"/>
    <line x1="430" y1="314" x2="428" y2="330" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="560,300 554,314 566,314" fill="#0d9488"/>
    <line x1="560" y1="314" x2="558" y2="332" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="660,300 654,314 666,314" fill="#0d9488"/>
    <line x1="660" y1="314" x2="658" y2="330" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 3"/>
    <polygon points="760,300 754,314 766,314" fill="#0d9488"/>
    <line x1="760" y1="314" x2="758" y2="332" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 3"/>
  </g>
  <circle cx="430" cy="344" r="5" fill="#22d3ee" opacity="0.7"/>
  <circle cx="560" cy="348" r="5" fill="#22d3ee" opacity="0.7"/>
  <circle cx="660" cy="342" r="5" fill="#22d3ee" opacity="0.7"/>
  <circle cx="760" cy="348" r="5" fill="#22d3ee" opacity="0.7"/>
  <text x="615" y="252" font-size="12.5" font-weight="700" fill="#0d9488" text-anchor="middle">Dry fog nozzle row, 5 - 10 micron</text>

  <!-- rubber seals -->
  <rect x="398" y="386" width="10" height="18" fill="#334155"/>
  <rect x="818" y="386" width="10" height="18" fill="#334155"/>
  <text x="356" y="400" font-size="12" fill="#334155" text-anchor="end">Rubber</text>
  <text x="356" y="414" font-size="12" fill="#334155" text-anchor="end">seal strip</text>
  <line x1="360" y1="395" x2="396" y2="394" stroke="#334155" stroke-width="1.2"/>

  <!-- interlock box -->
  <rect x="640" y="140" width="300" height="112" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <text x="790" y="166" font-size="14" font-weight="700" fill="#0c4a6e" text-anchor="middle">Interlock logic</text>
  <text x="660" y="192" font-size="12.5" fill="#334155">Belt running signal = TRUE</text>
  <text x="660" y="212" font-size="12.5" fill="#334155">and material flow = TRUE</text>
  <text x="660" y="232" font-size="12.5" fill="#334155">Dry fog ON; OFF 30-60 s after stop</text>

  <line x1="640" y1="196" x2="440" y2="290" stroke="#0284c7" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="500" y="240" font-size="12" fill="#0284c7">no water on an empty belt</text>

  <!-- bottom notes -->
  <rect x="40" y="474" width="920" height="118" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="500" font-size="14" font-weight="700" fill="#0f172a">Why this arrangement works</text>
  <text x="60" y="524" font-size="13.5" fill="#475569">1. The nozzle sits inside the enclosure, so the droplet reaches the dust while it is still concentrated and still moving slowly.</text>
  <text x="60" y="548" font-size="13.5" fill="#475569">2. Sealing and the damping plate remove most of the carrier airflow, so the fog does not have to fight a jet of dusty air.</text>
  <text x="60" y="572" font-size="13.5" fill="#475569">3. The interlock keeps water off an empty belt, which is what protects against belt slip, chute build-up and winter icing.</text>

  <text x="40" y="614" font-size="12.5" fill="#94a3b8">Schematic cross section, not to scale. Nozzle count and spacing are determined by chute width, drop height and belt speed.</text>
</svg>
