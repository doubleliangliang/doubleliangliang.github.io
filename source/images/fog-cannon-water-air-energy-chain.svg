<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Inside a Fog Cannon: The Water and Air Energy Chain</text>
  <text x="40" y="72" font-size="15" fill="#64748b">One machine, two working fluids, and a single output: a transported droplet spectrum</text>

  <!-- trailer frame -->
  <rect x="60" y="404" width="520" height="16" rx="4" fill="#cbd5e1"/>
  <circle cx="150" cy="432" r="14" fill="#94a3b8"/>
  <circle cx="500" cy="432" r="14" fill="#94a3b8"/>

  <!-- water source -->
  <rect x="60" y="140" width="130" height="96" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="125" y="178" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Water source</text>
  <text x="125" y="200" font-size="11.5" fill="#3b82f6" text-anchor="middle">tank / mains /</text>
  <text x="125" y="217" font-size="11.5" fill="#3b82f6" text-anchor="middle">reclaimed water</text>

  <!-- pump -->
  <rect x="228" y="162" width="118" height="76" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="287" y="194" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">High-pressure</text>
  <text x="287" y="212" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">pump</text>
  <line x1="190" y1="188" x2="228" y2="196" stroke="#93c5fd" stroke-width="6"/>

  <!-- control cabinet -->
  <rect x="228" y="268" width="118" height="76" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="287" y="300" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">Control cabinet</text>
  <text x="287" y="320" font-size="11.5" fill="#64748b" text-anchor="middle">VFD / PLC / dosing</text>

  <!-- turret -->
  <rect x="152" y="352" width="164" height="54" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="234" y="384" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Turret + elevation</text>
  <line x1="324" y1="404" x2="360" y2="356" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>

  <!-- fan housing -->
  <rect x="348" y="222" width="168" height="144" rx="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="428" cy="294" r="54" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <line x1="428" y1="294" x2="428" y2="244" stroke="#94a3b8" stroke-width="3"/>
  <line x1="428" y1="294" x2="471" y2="321" stroke="#94a3b8" stroke-width="3"/>
  <line x1="428" y1="294" x2="385" y2="321" stroke="#94a3b8" stroke-width="3"/>
  <line x1="428" y1="294" x2="456" y2="253" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="428" y1="294" x2="400" y2="253" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="428" y1="294" x2="428" y2="338" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="428" cy="294" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>

  <!-- barrel -->
  <rect x="518" y="242" width="128" height="104" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>

  <!-- nozzle ring -->
  <ellipse cx="648" cy="294" rx="15" ry="52" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="648" cy="252" r="4.5" fill="#2563eb"/>
  <circle cx="648" cy="273" r="4.5" fill="#2563eb"/>
  <circle cx="648" cy="294" r="4.5" fill="#2563eb"/>
  <circle cx="648" cy="315" r="4.5" fill="#2563eb"/>
  <circle cx="648" cy="336" r="4.5" fill="#2563eb"/>

  <!-- water line to nozzle ring -->
  <path d="M 346 178 C 470 108 610 150 648 240" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 6"/>
  <path d="M 346 178 C 470 108 610 150 648 240" fill="none" stroke="none"/>

  <!-- spray cone -->
  <polygon points="655,250 655,338 890,412 890,176" fill="#dbeafe" opacity="0.55"/>
  <polygon points="655,250 655,338 890,412 890,176" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
  <circle cx="715" cy="252" r="3.5" fill="#2563eb"/>
  <circle cx="760" cy="292" r="3.5" fill="#2563eb"/>
  <circle cx="700" cy="322" r="3.5" fill="#2563eb"/>
  <circle cx="805" cy="244" r="3.5" fill="#2563eb"/>
  <circle cx="838" cy="316" r="3.5" fill="#2563eb"/>
  <circle cx="792" cy="360" r="3.5" fill="#2563eb"/>
  <circle cx="862" cy="232" r="3.5" fill="#2563eb"/>
  <circle cx="742" cy="352" r="3.5" fill="#2563eb"/>

  <!-- numbered markers -->
  <circle cx="125" cy="140" r="15" fill="#A31F34"/>
  <text x="125" y="146" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="346" cy="200" r="15" fill="#A31F34"/>
  <text x="346" y="206" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="346" cy="294" r="15" fill="#A31F34"/>
  <text x="346" y="300" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <circle cx="136" cy="336" r="15" fill="#A31F34"/>
  <text x="136" y="342" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <circle cx="648" cy="200" r="15" fill="#A31F34"/>
  <text x="648" y="206" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <circle cx="890" cy="176" r="15" fill="#A31F34"/>
  <text x="890" y="182" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>

  <text x="894" y="126" font-size="13" fill="#64748b">transported</text>
  <text x="894" y="146" font-size="13" fill="#64748b">fog plume</text>

  <!-- legend -->
  <rect x="40" y="470" width="920" height="104" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="500" font-size="12.5" fill="#334155"><tspan font-weight="700">1</tspan> Stores the working medium; water quality ends up in the nozzles.</text>
  <text x="60" y="528" font-size="12.5" fill="#334155"><tspan font-weight="700">2</tspan> Converts electrical energy into pressure, which sets droplet size.</text>
  <text x="60" y="556" font-size="12.5" fill="#334155"><tspan font-weight="700">3</tspan> Sequences the machine: fan, then water, then oscillation.</text>
  <text x="560" y="500" font-size="12.5" fill="#334155"><tspan font-weight="700">4</tspan> Aims the machine in two axes; coverage is geometry.</text>
  <text x="560" y="528" font-size="12.5" fill="#334155"><tspan font-weight="700">5</tspan> Atomises the water into a chosen droplet spectrum.</text>
  <text x="560" y="556" font-size="12.5" fill="#334155"><tspan font-weight="700">6</tspan> Provides the transport energy that carries the fog out.</text>

  <text x="40" y="606" font-size="14" fill="#334155">A fog cannon is therefore two systems bolted together: a hydraulics problem that decides droplet size, and an aerodynamics problem that decides whether those droplets arrive.</text>
  <text x="40" y="630" font-size="14" fill="#334155">Almost every disappointing installation fails in one of those two places, and almost never in both.</text>
</svg>
