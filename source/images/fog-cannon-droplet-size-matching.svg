<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Droplet Size vs. Dust Particle Size: The Matching Principle</text>
  <text x="40" y="72" font-size="15" fill="#64748b">Capture efficiency improves when droplet diameter and target dust diameter are of the same order</text>

  <!-- plot area x 90-940, y 120-520 -->
  <rect x="90" y="120" width="850" height="400" fill="#fbfdff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- horizontal grid -->
  <line x1="90" y1="120" x2="940" y2="120" stroke="#eef2f7" stroke-width="1"/>
  <line x1="90" y1="200" x2="940" y2="200" stroke="#eef2f7" stroke-width="1"/>
  <line x1="90" y1="280" x2="940" y2="280" stroke="#eef2f7" stroke-width="1"/>
  <line x1="90" y1="360" x2="940" y2="360" stroke="#eef2f7" stroke-width="1"/>
  <line x1="90" y1="440" x2="940" y2="440" stroke="#eef2f7" stroke-width="1"/>
  <line x1="90" y1="520" x2="940" y2="520" stroke="#cbd5e1" stroke-width="2"/>

  <text x="80" y="125" font-size="12" fill="#64748b" text-anchor="end">100%</text>
  <text x="80" y="205" font-size="12" fill="#64748b" text-anchor="end">80%</text>
  <text x="80" y="285" font-size="12" fill="#64748b" text-anchor="end">60%</text>
  <text x="80" y="365" font-size="12" fill="#64748b" text-anchor="end">40%</text>
  <text x="80" y="445" font-size="12" fill="#64748b" text-anchor="end">20%</text>
  <text x="80" y="525" font-size="12" fill="#64748b" text-anchor="end">0%</text>

  <!-- vertical grid and x labels -->
  <line x1="90" y1="120" x2="90" y2="520" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="302.5" y1="120" x2="302.5" y2="520" stroke="#eef2f7" stroke-width="1"/>
  <line x1="515" y1="120" x2="515" y2="520" stroke="#eef2f7" stroke-width="1"/>
  <line x1="727.5" y1="120" x2="727.5" y2="520" stroke="#eef2f7" stroke-width="1"/>
  <line x1="940" y1="120" x2="940" y2="520" stroke="#eef2f7" stroke-width="1"/>

  <text x="90" y="545" font-size="13" fill="#475569" text-anchor="middle">0.1</text>
  <text x="302.5" y="545" font-size="13" fill="#475569" text-anchor="middle">1</text>
  <text x="515" y="545" font-size="13" fill="#475569" text-anchor="middle">10</text>
  <text x="727.5" y="545" font-size="13" fill="#475569" text-anchor="middle">100</text>
  <text x="940" y="545" font-size="13" fill="#475569" text-anchor="middle">1000</text>
  <text x="515" y="572" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Dust particle diameter (micron, log scale)</text>

  <text x="30" y="320" font-size="14" font-weight="600" fill="#0f172a" transform="rotate(-90 30 320)" text-anchor="middle">Capture efficiency (indicative)</text>

  <!-- respirable zone -->
  <rect x="90" y="120" width="425" height="400" fill="#fff1f2" opacity="0.55"/>
  <text x="300" y="145" font-size="12.5" font-weight="700" fill="#9f1239" text-anchor="middle">Respirable / PM2.5 - PM10 dominant zone</text>

  <!-- fine mist 10-50 -->
  <polyline points="90,208 302.5,168 515,180 727.5,232 940,280" fill="none" stroke="#0d9488" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- medium 50-150 -->
  <polyline points="90,380 302.5,312 515,200 727.5,168 940,208" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- coarse >200 -->
  <polyline points="90,472 302.5,432 515,340 727.5,220 940,180" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- legend -->
  <rect x="620" y="380" width="300" height="120" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" opacity="0.96"/>
  <line x1="640" y1="408" x2="676" y2="408" stroke="#0d9488" stroke-width="3.5"/>
  <text x="686" y="413" font-size="13" fill="#0f172a">Fine mist, 10 - 50 micron</text>
  <line x1="640" y1="440" x2="676" y2="440" stroke="#2563eb" stroke-width="3.5"/>
  <text x="686" y="445" font-size="13" fill="#0f172a">Medium spray, 50 - 150 micron</text>
  <line x1="640" y1="472" x2="676" y2="472" stroke="#f59e0b" stroke-width="3.5"/>
  <text x="686" y="477" font-size="13" fill="#0f172a">Coarse spray, above 200 micron</text>

  <!-- takeaway -->
  <rect x="40" y="596" width="920" height="0" fill="none"/>
  <text x="40" y="600" font-size="13.5" fill="#475569">Engineering takeaway: coarse spray wets and knocks down visible plumes over stockpiles, but it barely touches respirable dust;</text>
  <text x="40" y="622" font-size="13.5" fill="#475569">for PM10 and PM2.5, move to dry fog or micro mist, and shorten the distance between nozzle and dust source.</text>

  <text x="40" y="640" font-size="12.5" fill="#94a3b8">Schematic indicative curves, not measured data. Actual efficiency depends on droplet spectrum, relative velocity, airflow and humidity.</text>
</svg>
