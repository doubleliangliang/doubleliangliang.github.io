<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#0f172a">Where Dust Sits and Where Heat Comes From</text>
  <text x="40" y="72" font-size="15" fill="#64748b">A ordinary workshop cross section: accumulation points above, ignition sources below</text>

  <!-- building -->
  <rect x="60" y="120" width="620" height="380" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <path d="M60 120 L 370 80 L 680 120" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>

  <!-- roof beam with dust -->
  <rect x="90" y="160" width="560" height="16" fill="#cbd5e1" stroke="#64748b"/>
  <rect x="90" y="150" width="560" height="10" fill="#94a3b8"/>
  <text x="370" y="142" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">roof beam - thick layer, never cleaned</text>

  <!-- cable tray -->
  <rect x="120" y="220" width="320" height="12" fill="#cbd5e1" stroke="#64748b"/>
  <rect x="120" y="212" width="320" height="8" fill="#94a3b8"/>
  <text x="470" y="228" font-size="12" font-weight="700" fill="#b45309">cable tray</text>
  <text x="470" y="244" font-size="11" fill="#64748b">dust + cable heat ageing</text>

  <!-- lamp -->
  <circle cx="240" cy="290" r="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="240" y="330" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">lamp /</text>
  <text x="240" y="346" font-size="11" font-weight="700" fill="#b45309" text-anchor="middle">luminaire</text>

  <!-- duct -->
  <rect x="470" y="270" width="150" height="26" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="545" y="288" font-size="11" fill="#475569" text-anchor="middle">exhaust duct</text>
  <text x="545" y="322" font-size="11" fill="#64748b" text-anchor="middle">settling inside pipe</text>

  <!-- machine + motor -->
  <rect x="150" y="380" width="150" height="90" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="225" y="420" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">process</text>
  <text x="225" y="438" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">machine</text>
  <circle cx="340" cy="425" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="340" y="422" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">motor</text>
  <text x="340" y="436" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">bearing</text>

  <!-- filter -->
  <rect x="440" y="370" width="110" height="100" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="495" y="410" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">filter</text>
  <text x="495" y="428" font-size="12" font-weight="700" fill="#991b1b" text-anchor="middle">housing</text>
  <text x="495" y="446" font-size="10" fill="#991b1b" text-anchor="middle">20 zone</text>

  <!-- floor -->
  <rect x="60" y="470" width="620" height="30" fill="#e2e8f0" stroke="#475569"/>
  <text x="370" y="522" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">floor dust - the fuel reserve for a secondary explosion</text>

  <!-- callouts -->
  <g>
    <rect x="710" y="120" width="250" height="210" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="730" y="150" font-size="14" font-weight="700" fill="#b45309">Accumulation points</text>
    <text x="730" y="178" font-size="12" fill="#475569">- roof beams and purlins</text>
    <text x="730" y="200" font-size="12" fill="#475569">- cable trays and conduits</text>
    <text x="730" y="222" font-size="12" fill="#475569">- light fittings and their tops</text>
    <text x="730" y="244" font-size="12" fill="#475569">- duct interiors and elbows</text>
    <text x="730" y="266" font-size="12" fill="#475569">- motor fins and bearing houses</text>
    <text x="730" y="288" font-size="12" fill="#475569">- ledges, window sills, frames</text>
    <text x="730" y="310" font-size="12" fill="#475569">- floor and pit</text>
  </g>

  <g>
    <rect x="710" y="348" width="250" height="200" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="730" y="378" font-size="14" font-weight="700" fill="#b91c1c">Ignition sources nearby</text>
    <text x="730" y="406" font-size="12" fill="#475569">- hot bearings and motor shells</text>
    <text x="730" y="428" font-size="12" fill="#475569">- lamps and heated enclosures</text>
    <text x="730" y="450" font-size="12" fill="#475569">- welding and cutting spatter</text>
    <text x="730" y="472" font-size="12" fill="#475569">- static discharge</text>
    <text x="730" y="494" font-size="12" fill="#475569">- mechanical friction sparks</text>
    <text x="730" y="516" font-size="12" fill="#475569">- smouldering embers from</text>
    <text x="744" y="534" font-size="12" fill="#475569">upstream equipment</text>
  </g>

  <rect x="60" y="562" width="900" height="42" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="78" y="588" font-size="13" fill="#047857">Every accumulation point on the left has an ignition source on the right within a few metres. That pairing is the hazard.</text>
</svg>
