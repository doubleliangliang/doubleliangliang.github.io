<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1200" height="490" fill="#FFFFFF"/>
  <text x="60" y="46" font-size="25" font-weight="700" fill="#1F1F23">Closing the Loop: Six Functions That Replace a Timer</text>
  <text x="60" y="74" font-size="13.5" fill="#606068">The loop matters more than any single step. Verification feeds back into the thresholds, which is why the system improves instead of drifting.</text>

  <!-- row 1 -->
  <rect x="60" y="112" width="330" height="140" rx="10" fill="#F7F6FA" stroke="#DCD8E5"/>
  <circle cx="92" cy="146" r="15" fill="#5B4B8A"/>
  <text x="92" y="151" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="118" y="151" font-size="14.5" font-weight="700" fill="#1F1F23">Monitor</text>
  <text x="80" y="182" font-size="11.5" fill="#4A4A50">Cameras at emission points, PM monitors at</text>
  <text x="80" y="200" font-size="11.5" fill="#4A4A50">hot spots and at the boundary, plus wind</text>
  <text x="80" y="218" font-size="11.5" fill="#4A4A50">speed and direction.</text>

  <rect x="435" y="112" width="330" height="140" rx="10" fill="#F7F6FA" stroke="#DCD8E5"/>
  <circle cx="467" cy="146" r="15" fill="#5B4B8A"/>
  <text x="467" y="151" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="493" y="151" font-size="14.5" font-weight="700" fill="#1F1F23">Identify</text>
  <text x="455" y="182" font-size="11.5" fill="#4A4A50">Vision models detect plumes, separate dust</text>
  <text x="455" y="200" font-size="11.5" fill="#4A4A50">from steam and water vapour, and recognise</text>
  <text x="455" y="218" font-size="11.5" fill="#4A4A50">the operation generating it.</text>

  <rect x="810" y="112" width="330" height="140" rx="10" fill="#F7F6FA" stroke="#DCD8E5"/>
  <circle cx="842" cy="146" r="15" fill="#5B4B8A"/>
  <text x="842" y="151" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="868" y="151" font-size="14.5" font-weight="700" fill="#1F1F23">Grade</text>
  <text x="830" y="182" font-size="11.5" fill="#4A4A50">Detection becomes a proportionate response</text>
  <text x="830" y="200" font-size="11.5" fill="#4A4A50">instead of a single threshold: short burst,</text>
  <text x="830" y="218" font-size="11.5" fill="#4A4A50">full zone preset, or escalation.</text>

  <!-- row 2 -->
  <rect x="60" y="272" width="330" height="140" rx="10" fill="#F7F6FA" stroke="#DCD8E5"/>
  <circle cx="92" cy="306" r="15" fill="#5B4B8A"/>
  <text x="92" y="311" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="118" y="311" font-size="14.5" font-weight="700" fill="#1F1F23">Trigger</text>
  <text x="80" y="342" font-size="11.5" fill="#4A4A50">Only the affected zone runs, on stored presets</text>
  <text x="80" y="360" font-size="11.5" fill="#4A4A50">for angle, flow, droplet size and duration.</text>
  <text x="80" y="378" font-size="11.5" fill="#4A4A50">Operators keep authority over their area.</text>

  <rect x="435" y="272" width="330" height="140" rx="10" fill="#F7F6FA" stroke="#DCD8E5"/>
  <circle cx="467" cy="306" r="15" fill="#5B4B8A"/>
  <text x="467" y="311" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="493" y="311" font-size="14.5" font-weight="700" fill="#1F1F23">Verify</text>
  <text x="455" y="342" font-size="11.5" fill="#4A4A50">The sensors that raised the alarm confirm the</text>
  <text x="455" y="360" font-size="11.5" fill="#4A4A50">plume cleared, or the system escalates instead</text>
  <text x="455" y="378" font-size="11.5" fill="#4A4A50">of spraying indefinitely.</text>

  <rect x="810" y="272" width="330" height="140" rx="10" fill="#F7F6FA" stroke="#DCD8E5"/>
  <circle cx="842" cy="306" r="15" fill="#5B4B8A"/>
  <text x="842" y="311" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="868" y="311" font-size="14.5" font-weight="700" fill="#1F1F23">Record</text>
  <text x="830" y="342" font-size="11.5" fill="#4A4A50">Zone status, images, consumption and</text>
  <text x="830" y="360" font-size="11.5" fill="#4A4A50">compliance records, exported on a schedule</text>
  <text x="830" y="378" font-size="11.5" fill="#4A4A50">that an auditor or reviewer can read.</text>

  <text x="60" y="450" font-size="12" fill="#808088">Two rules keep a system alive: thresholds set per zone rather than plant-wide, and a commissioning period treated as scope rather than as evidence that the product is unfinished.</text>
</svg>
