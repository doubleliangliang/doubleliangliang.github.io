<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="660" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#1A1A1A">Same Spec Sheet, Different Result</text>
  <text x="40" y="76" font-size="14" fill="#6B6B6B">Two 120 m cannons can carry identical numbers and behave nothing alike. The difference is whether</text>
  <text x="40" y="96" font-size="14" fill="#6B6B6B">the parts were designed as one system or assembled from a catalogue.</text>

  <defs>
    <marker id="arwd" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#C7B49A"/>
    </marker>
    <marker id="arwr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#A31F34"/>
    </marker>
  </defs>

  <!-- CHAIN CARDS -->
  <rect x="40" y="130" width="173" height="200" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <text x="60" y="158" font-size="18" font-weight="700" fill="#C7B49A">01</text>
  <text x="60" y="186" font-size="13" font-weight="700" fill="#8A6A41">PUMP</text>
  <text x="60" y="214" font-size="11" fill="#6B5233">Pressure–flow curve</text>
  <text x="60" y="233" font-size="11" fill="#6B5233">matched to the total</text>
  <text x="60" y="252" font-size="11" fill="#6B5233">flow of the spray ring</text>

  <rect x="229" y="130" width="173" height="200" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <text x="249" y="158" font-size="18" font-weight="700" fill="#C7B49A">02</text>
  <text x="249" y="186" font-size="13" font-weight="700" fill="#8A6A41">SPRAY RING</text>
  <text x="249" y="214" font-size="11" fill="#6B5233">Nozzle count, spacing,</text>
  <text x="249" y="233" font-size="11" fill="#6B5233">angle and ring count,</text>
  <text x="249" y="252" font-size="11" fill="#6B5233">coupled to the fan's</text>
  <text x="249" y="271" font-size="11" fill="#6B5233">flow field</text>

  <rect x="418" y="130" width="173" height="200" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <text x="438" y="158" font-size="18" font-weight="700" fill="#C7B49A">03</text>
  <text x="438" y="186" font-size="13" font-weight="700" fill="#8A6A41">NOZZLES</text>
  <text x="438" y="214" font-size="11" fill="#6B5233">Consistent flow and</text>
  <text x="438" y="233" font-size="11" fill="#6B5233">spray angle between</text>
  <text x="438" y="252" font-size="11" fill="#6B5233">units; wear- and</text>
  <text x="438" y="271" font-size="11" fill="#6B5233">clog-resistant</text>

  <rect x="607" y="130" width="173" height="200" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <text x="627" y="158" font-size="18" font-weight="700" fill="#C7B49A">04</text>
  <text x="627" y="186" font-size="13" font-weight="700" fill="#8A6A41">FAN</text>
  <text x="627" y="214" font-size="11" fill="#6B5233">Air volume, static</text>
  <text x="627" y="233" font-size="11" fill="#6B5233">pressure and throw,</text>
  <text x="627" y="252" font-size="11" fill="#6B5233">matched to the</text>
  <text x="627" y="271" font-size="11" fill="#6B5233">droplet spectrum</text>

  <rect x="796" y="130" width="173" height="200" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <text x="816" y="158" font-size="18" font-weight="700" fill="#C7B49A">05</text>
  <text x="816" y="186" font-size="13" font-weight="700" fill="#8A6A41">CONTROL</text>
  <text x="816" y="214" font-size="11" fill="#6B5233">Zone logic, variable</text>
  <text x="816" y="233" font-size="11" fill="#6B5233">speed and verification</text>
  <text x="816" y="252" font-size="11" fill="#6B5233">— not a timer and</text>
  <text x="816" y="271" font-size="11" fill="#6B5233">a contactor</text>

  <rect x="985" y="130" width="173" height="200" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <text x="1005" y="158" font-size="18" font-weight="700" fill="#C7B49A">06</text>
  <text x="1005" y="186" font-size="13" font-weight="700" fill="#8A6A41">STRUCTURE</text>
  <text x="1005" y="214" font-size="11" fill="#6B5233">Corrosion protection,</text>
  <text x="1005" y="233" font-size="11" fill="#6B5233">bearing and motor</text>
  <text x="1005" y="252" font-size="11" fill="#6B5233">protection, drainage,</text>
  <text x="1005" y="271" font-size="11" fill="#6B5233">service access</text>

  <!-- CONVERGE -->
  <line x1="126" y1="330" x2="126" y2="352" stroke="#D8C9B2" stroke-width="1.5"/>
  <line x1="315" y1="330" x2="315" y2="352" stroke="#D8C9B2" stroke-width="1.5"/>
  <line x1="504" y1="330" x2="504" y2="352" stroke="#D8C9B2" stroke-width="1.5"/>
  <line x1="693" y1="330" x2="693" y2="352" stroke="#D8C9B2" stroke-width="1.5"/>
  <line x1="882" y1="330" x2="882" y2="352" stroke="#D8C9B2" stroke-width="1.5"/>
  <line x1="1071" y1="330" x2="1071" y2="352" stroke="#D8C9B2" stroke-width="1.5"/>
  <line x1="126" y1="352" x2="1071" y2="352" stroke="#D8C9B2" stroke-width="1.5"/>
  <line x1="600" y1="352" x2="600" y2="376" stroke="#D8C9B2" stroke-width="2" marker-end="url(#arwd)"/>

  <!-- OUTCOME: MATCHED -->
  <rect x="40" y="384" width="540" height="256" rx="12" fill="#EFF5F9" stroke="#CFE0EA" stroke-width="1.5"/>
  <rect x="40" y="384" width="6" height="256" rx="3" fill="#2E6F8E"/>
  <text x="70" y="420" font-size="16" font-weight="700" fill="#2E6F8E">Designed as one system</text>
  <text x="70" y="452" font-size="12.5" fill="#28566E">An even spray field across the whole pattern, with no dense</text>
  <text x="70" y="472" font-size="12.5" fill="#28566E">core and no bare gaps.</text>
  <text x="70" y="502" font-size="12.5" fill="#28566E">Reach and droplet size hold up together, instead of one being</text>
  <text x="70" y="522" font-size="12.5" fill="#28566E">bought at the expense of the other.</text>
  <text x="70" y="552" font-size="12.5" fill="#28566E">Performance is repeatable from unit to unit, so a site can be</text>
  <text x="70" y="572" font-size="12.5" fill="#28566E">designed once and extended later.</text>
  <text x="70" y="602" font-size="12.5" fill="#28566E">Operators leave it switched on, because it does not create</text>
  <text x="70" y="622" font-size="12.5" fill="#28566E">problems they have to manage.</text>

  <!-- OUTCOME: MISMATCHED -->
  <rect x="620" y="384" width="540" height="256" rx="12" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.5"/>
  <rect x="620" y="384" width="6" height="256" rx="3" fill="#A31F34"/>
  <text x="650" y="420" font-size="16" font-weight="700" fill="#A31F34">Assembled from a catalogue</text>
  <text x="650" y="452" font-size="12.5" fill="#4A3A3E">Pressure falls short of the ring's demand, droplets coarsen, and</text>
  <text x="650" y="472" font-size="12.5" fill="#4A3A3E">reach and atomisation degrade together.</text>
  <text x="650" y="502" font-size="12.5" fill="#4A3A3E">The spray field is hollow or lopsided: part of the target is</text>
  <text x="650" y="522" font-size="12.5" fill="#4A3A3E">over-sprayed, part of it is bare, and fan energy is wasted.</text>
  <text x="650" y="552" font-size="12.5" fill="#4A3A3E">One deviating nozzle distorts the pattern, and the fault gets</text>
  <text x="650" y="572" font-size="12.5" fill="#4A3A3E">attributed to the nozzles rather than to the design.</text>
  <text x="650" y="602" font-size="12.5" fill="#4A3A3E">People switch it off — and the visible-dust check is failed by a</text>
  <text x="650" y="622" font-size="12.5" fill="#4A3A3E">machine nobody is running.</text>
</svg>
