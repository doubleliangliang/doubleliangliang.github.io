<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">What a Fog Cannon Can Reach — and What It Cannot</text>
  <text x="40" y="72" font-size="15" fill="#64748b">Airborne particle populations on a logarithmic size axis, with the droplet band that matches each one</text>

  <!-- ===== PART A ===== -->
  <text x="40" y="112" font-size="13" font-weight="700" fill="#A31F34" letter-spacing="1.2">PART A — PARTICLE POPULATIONS IN THE AIR</text>

  <!-- decade gridlines and axis -->
  <line x1="250" y1="126" x2="250" y2="412" stroke="#eef2f7" stroke-width="1"/>
  <line x1="356" y1="126" x2="356" y2="412" stroke="#eef2f7" stroke-width="1"/>
  <line x1="462" y1="126" x2="462" y2="412" stroke="#eef2f7" stroke-width="1"/>
  <line x1="568" y1="126" x2="568" y2="412" stroke="#eef2f7" stroke-width="1"/>
  <line x1="674" y1="126" x2="674" y2="412" stroke="#eef2f7" stroke-width="1"/>
  <line x1="780" y1="126" x2="780" y2="412" stroke="#eef2f7" stroke-width="1"/>

  <!-- row 1: secondary PM2.5 -->
  <text x="238" y="141" font-size="13" font-weight="700" fill="#334155" text-anchor="end">Secondary PM2.5</text>
  <text x="238" y="157" font-size="11.5" fill="#64748b" text-anchor="end">sulphate · nitrate · organics</text>
  <rect x="250" y="131" width="212" height="30" rx="4" fill="#cbd5e1"/>
  <text x="798" y="150" font-size="12.5" fill="#64748b">Not a capture target</text>

  <!-- row 2: fine primary PM2.5 -->
  <text x="238" y="199" font-size="13" font-weight="700" fill="#334155" text-anchor="end">Fine primary particulate</text>
  <text x="238" y="215" font-size="11.5" fill="#64748b" text-anchor="end">odour-carrying aerosols</text>
  <rect x="356" y="189" width="148" height="30" rx="4" fill="#0e7490"/>
  <text x="798" y="208" font-size="12.5" fill="#0e7490">Dry fog · 1–10 µm</text>

  <!-- row 3: PM10 -->
  <text x="238" y="257" font-size="13" font-weight="700" fill="#334155" text-anchor="end">PM10 from traffic,</text>
  <text x="238" y="273" font-size="11.5" fill="#64748b" text-anchor="end">demolition, handling</text>
  <rect x="504" y="247" width="64" height="30" rx="4" fill="#A31F34"/>
  <text x="798" y="266" font-size="12.5" fill="#A31F34">Cannon · spectrum low</text>

  <!-- row 4: coarse dust -->
  <text x="238" y="315" font-size="13" font-weight="700" fill="#334155" text-anchor="end">Coarse dust lifted</text>
  <text x="238" y="331" font-size="11.5" fill="#64748b" text-anchor="end">by wind and wheels</text>
  <rect x="568" y="305" width="106" height="30" rx="4" fill="#A31F34"/>
  <text x="798" y="324" font-size="12.5" fill="#A31F34">Cannon · 50–150 µm</text>

  <!-- row 5: bulk handling plume -->
  <text x="238" y="373" font-size="13" font-weight="700" fill="#334155" text-anchor="end">Visible dust plume,</text>
  <text x="238" y="389" font-size="11.5" fill="#64748b" text-anchor="end">bulk material handling</text>
  <rect x="674" y="363" width="106" height="30" rx="4" fill="#7f1a29"/>
  <text x="798" y="382" font-size="12.5" fill="#7f1a29">Cannon · high flow</text>

  <!-- axis -->
  <line x1="250" y1="412" x2="790" y2="412" stroke="#cbd5e1" stroke-width="2"/>
  <text x="250" y="430" font-size="11.5" fill="#64748b" text-anchor="middle">0.01</text>
  <text x="356" y="430" font-size="11.5" fill="#64748b" text-anchor="middle">0.1</text>
  <text x="462" y="430" font-size="11.5" fill="#64748b" text-anchor="middle">1</text>
  <text x="568" y="430" font-size="11.5" fill="#64748b" text-anchor="middle">10</text>
  <text x="674" y="430" font-size="11.5" fill="#64748b" text-anchor="middle">100</text>
  <text x="780" y="430" font-size="11.5" fill="#64748b" text-anchor="middle">1000</text>
  <text x="812" y="430" font-size="11.5" fill="#94a3b8">µm · log scale</text>

  <line x1="40" y1="452" x2="960" y2="452" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- ===== PART B ===== -->
  <text x="40" y="482" font-size="13" font-weight="700" fill="#A31F34" letter-spacing="1.2">PART B — DROPLET BANDS, SAME AXIS</text>

  <text x="238" y="499" font-size="13" font-weight="700" fill="#334155" text-anchor="end">Dry fog system</text>
  <rect x="462" y="484" width="106" height="24" rx="4" fill="#0e7490" opacity="0.85"/>
  <text x="580" y="501" font-size="11.5" fill="#0e7490">1–10 µm · point capture, no added moisture</text>

  <text x="238" y="547" font-size="13" font-weight="700" fill="#334155" text-anchor="end">Fog cannon / anti-smog gun</text>
  <rect x="587" y="532" width="106" height="24" rx="4" fill="#A31F34" opacity="0.85"/>
  <text x="705" y="549" font-size="11.5" fill="#A31F34">15–150 µm · area capture, surface conditioning</text>

  <text x="238" y="595" font-size="13" font-weight="700" fill="#334155" text-anchor="end">Plain water truck</text>
  <text x="252" y="597" font-size="12.5" fill="#64748b">≈1000 µm droplets, off this axis — wets the road surface and misses what is still in the air</text>

  <!-- caption -->
  <line x1="40" y1="624" x2="960" y2="624" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="40" y="648" font-size="13" fill="#334155">Capture works when droplet and particle are of comparable size: dry fog droplets land on fine particulate, cannon droplets land on coarse dust.</text>
  <text x="40" y="668" font-size="13" fill="#334155">Splash-size water from a plain water truck overlaps almost nothing that is still airborne.</text>
</svg>
