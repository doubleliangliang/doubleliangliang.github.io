<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1200" height="860" fill="#FFFFFF"/>

  <text x="40" y="58" font-size="23" font-weight="700" fill="#1F1F1F">Seven Layers of Control Inside an Enclosed Coal Yard</text>
  <text x="40" y="88" font-size="13.5" fill="#5F5F5F">The enclosure is one layer. It is not the strategy.</text>
  <line x1="40" y1="110" x2="1160" y2="110" stroke="#E2E2E2" stroke-width="1"/>

  <rect x="60" y="130" width="1080" height="78" rx="8" fill="#A31F34" fill-opacity="0.08"/>
  <circle cx="106" cy="169" r="18" fill="#A31F34"/>
  <text x="106" y="175" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="146" y="164" font-size="15.5" font-weight="700" fill="#1F1F1F">Source control</text>
  <text x="146" y="188" font-size="12.5" fill="#4A4A4A">Lower drop heights, sealed chutes and skirt boards, damping plates to kill the positive pressure of a falling stream.</text>

  <rect x="60" y="216" width="1080" height="78" rx="8" fill="#C2691E" fill-opacity="0.09"/>
  <circle cx="106" cy="255" r="18" fill="#C2691E"/>
  <text x="106" y="261" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="146" y="250" font-size="15.5" font-weight="700" fill="#1F1F1F">At the transfer point</text>
  <text x="146" y="274" font-size="12.5" fill="#4A4A4A">Fine water mist or dry fog applied inside the enclosure at chutes, crusher outlets, trippers and loading spouts.</text>

  <rect x="60" y="302" width="1080" height="78" rx="8" fill="#8A6A41" fill-opacity="0.10"/>
  <circle cx="106" cy="341" r="18" fill="#8A6A41"/>
  <text x="106" y="347" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="146" y="336" font-size="15.5" font-weight="700" fill="#1F1F1F">Across the volume</text>
  <text x="146" y="360" font-size="12.5" fill="#4A4A4A">Fog cannons covering the working face, the reclaim area and the high-level dust layer, triggered by measurement.</text>

  <rect x="60" y="388" width="1080" height="78" rx="8" fill="#2E6F8E" fill-opacity="0.09"/>
  <circle cx="106" cy="427" r="18" fill="#2E6F8E"/>
  <text x="106" y="433" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="146" y="422" font-size="15.5" font-weight="700" fill="#1F1F1F">At the openings</text>
  <text x="146" y="446" font-size="12.5" fill="#4A4A4A">Fog curtains at vehicle gates, activated on approach, to contain what traffic would otherwise drag out.</text>

  <rect x="60" y="474" width="1080" height="78" rx="8" fill="#3F8F7A" fill-opacity="0.10"/>
  <circle cx="106" cy="513" r="18" fill="#3F8F7A"/>
  <text x="106" y="519" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="146" y="508" font-size="15.5" font-weight="700" fill="#1F1F1F">In the extract air</text>
  <text x="146" y="532" font-size="12.5" fill="#4A4A4A">Bag or cartridge filtration on mechanical ventilation, sized to the real duty, with recovered coal returned to process.</text>

  <rect x="60" y="560" width="1080" height="78" rx="8" fill="#6A4C93" fill-opacity="0.09"/>
  <circle cx="106" cy="599" r="18" fill="#6A4C93"/>
  <text x="106" y="605" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="146" y="594" font-size="15.5" font-weight="700" fill="#1F1F1F">Floor and steelwork</text>
  <text x="146" y="618" font-size="12.5" fill="#4A4A4A">Vacuum recovery, never compressed-air blowdown — the wrong method suspends the settled inventory as a cloud.</text>

  <rect x="60" y="646" width="1080" height="78" rx="8" fill="#4A4A4A" fill-opacity="0.08"/>
  <circle cx="106" cy="685" r="18" fill="#4A4A4A"/>
  <text x="106" y="691" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="146" y="680" font-size="15.5" font-weight="700" fill="#1F1F1F">Safety layer</text>
  <text x="146" y="704" font-size="12.5" fill="#4A4A4A">Dust hazard analysis, venting, isolation, gas and temperature monitoring with defined alarms and defined responses.</text>

  <rect x="60" y="748" width="1080" height="66" rx="8" fill="#A31F34" fill-opacity="0.08"/>
  <text x="88" y="777" font-size="14" font-weight="700" fill="#A31F34">One control layer interlocks all seven.</text>
  <text x="88" y="799" font-size="12.5" fill="#5F5F5F">Suppression starts before the handling equipment does, and stops after it stops.</text>
</svg>
