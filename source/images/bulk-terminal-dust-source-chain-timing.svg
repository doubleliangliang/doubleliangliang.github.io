  <text x="360" y="832" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#3E4C59">surface dries; the pulses at minute 12, 25 and 31 are uncontrolled</text>
  <text x="60" y="856" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#6B7480">The two clocks differ by two orders of magnitude. No volume applied on the slow clock acts on the fast one.</text>
