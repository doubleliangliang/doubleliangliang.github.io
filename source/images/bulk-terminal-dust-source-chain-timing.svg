  <text x="114" y="418" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#A31F34">grab discharge: a pulse every ~50 s</text>
  <line x1="110" y1="604" x2="1056" y2="604" stroke="#8A949F" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="1064" y="608" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7480">boundary hourly</text>
  <text x="1064" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6B7480">average</text>
  <text x="60" y="758" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#2E6F8E">Water cart / fixed sprinkler: one wet window, then a drying surface</text>
