<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866">
  <rect width="1200" height="866" fill="#FFFFFF"/>
  <text x="60" y="52" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="bold" fill="#1F2933">Why Coverage Misses the Emission</text>
  <text x="60" y="80" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5F5F5F">A bulk terminal emits on two clocks. Suppression sized to the slower one cannot act on the faster one.</text>
  <rect x="60" y="108" width="520" height="168" rx="8" fill="#FAFBFC" stroke="#E3E6EB" stroke-width="1.2"/>
  <rect x="60" y="108" width="6" height="168" rx="3" fill="#A31F34"/>
  <text x="88" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#1F2933">1  The moving point</text>
  <text x="88" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3E4C59">Grab hopper, transfer tower, loading spout</text>
  <text x="88" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F">Emission: 4-6 s per grab cycle, air above 10 m/s</text>
  <text x="88" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F">Dust: fine, &lt; 10 um fraction decides the plume</text>
  <text x="88" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#A31F34">Needs: fine droplets, delivered with momentum</text>
  <text x="88" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F">Moves with the crane. The nozzle ring does not.</text>
  <rect x="620" y="108" width="520" height="168" rx="8" fill="#FAFBFC" stroke="#E3E6EB" stroke-width="1.2"/>
  <rect x="620" y="108" width="6" height="168" rx="3" fill="#2E6F8E"/>
  <text x="648" y="140" font-family="Arial, Helvetica, sans-serif" font-size="16.5" font-weight="bold" fill="#1F2933">2  The open surface</text>
  <text x="648" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#3E4C59">Stockpile, haul road, apron, rail siding</text>
  <text x="648" y="190" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F">Emission: continuous, wind-driven, scales with area</text>
  <text x="648" y="210" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F">Dust: resuspended surface layer, wide size range</text>
  <text x="648" y="230" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#2E6F8E">Needs: range and coverage, larger droplets</text>
  <text x="648" y="258" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#5F5F5F">Stops only when the surface is wet or sheltered.</text>
  <text x="60" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#1F2933">One shift, two control cycles</text>
  <line x1="110" y1="650" x2="1050" y2="650" stroke="#C7CCD4" stroke-width="1.4"/>
  <line x1="110.0" y1="650" x2="110.0" y2="656" stroke="#C7CCD4" stroke-width="1.2"/>
