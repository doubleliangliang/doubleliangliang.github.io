<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1200" height="580" fill="#FFFFFF"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#1F1F23">Four Tools, Four Different Jobs</text>
  <text x="40" y="74" font-size="13.5" fill="#606068">These are not one product family ranked by size. Area, point, gate and loop each answer a different question.</text>

  <!-- column geometry: x = 31, 320, 609, 898 ; width 271 -->
  <!-- 1 AREA -->
  <rect x="31" y="104" width="271" height="420" rx="10" fill="#FDF6F7" stroke="#EBD3D8"/>
  <rect x="31" y="104" width="271" height="6" rx="3" fill="#A31F34"/>
  <text x="55" y="146" font-size="12" font-weight="700" fill="#A31F34" letter-spacing="1.5">AREA</text>
  <text x="55" y="174" font-size="16.5" font-weight="700" fill="#1F1F23">Long-range fog cannon</text>
  <text x="55" y="206" font-size="11.5" fill="#4A4A50">Projects atomised water across</text>
  <text x="55" y="224" font-size="11.5" fill="#4A4A50">open ground and brings a visible</text>
  <text x="55" y="242" font-size="11.5" fill="#4A4A50">plume down over an area.</text>
  <text x="55" y="286" font-size="10.5" font-weight="700" fill="#808088" letter-spacing="1">WHERE IT BELONGS</text>
  <text x="55" y="310" font-size="11.5" fill="#3A3A40">Raw material stockyard</text>
  <text x="55" y="330" font-size="11.5" fill="#3A3A40">Crushing station apron</text>
  <text x="55" y="350" font-size="11.5" fill="#3A3A40">Slag yard</text>
  <text x="55" y="370" font-size="11.5" fill="#3A3A40">Haul roads</text>
  <text x="55" y="414" font-size="10.5" font-weight="700" fill="#808088" letter-spacing="1">PRECONDITION</text>
  <text x="55" y="438" font-size="11.5" fill="#3A3A40">Reach and overlap set from</text>
  <text x="55" y="456" font-size="11.5" fill="#3A3A40">site wind data, not nameplate</text>
  <text x="55" y="474" font-size="11.5" fill="#3A3A40">figures; sweeping planned</text>

  <!-- 2 POINT -->
  <rect x="320" y="104" width="271" height="420" rx="10" fill="#F5F9FB" stroke="#CFE0E9"/>
  <rect x="320" y="104" width="271" height="6" rx="3" fill="#22668C"/>
  <text x="344" y="146" font-size="12" font-weight="700" fill="#22668C" letter-spacing="1.5">POINT</text>
  <text x="344" y="174" font-size="16.5" font-weight="700" fill="#1F1F23">Dry fog system</text>
  <text x="344" y="206" font-size="11.5" fill="#4A4A50">Micron droplets make fine</text>
  <text x="344" y="224" font-size="11.5" fill="#4A4A50">particles agglomerate and settle,</text>
  <text x="344" y="242" font-size="11.5" fill="#4A4A50">with negligible added moisture.</text>
  <text x="344" y="286" font-size="10.5" font-weight="700" fill="#808088" letter-spacing="1">WHERE IT BELONGS</text>
  <text x="344" y="310" font-size="11.5" fill="#3A3A40">Belt transfer points</text>
  <text x="344" y="330" font-size="11.5" fill="#3A3A40">Crusher feed and discharge</text>
  <text x="344" y="350" font-size="11.5" fill="#3A3A40">Screens, chutes, skirts</text>
  <text x="344" y="370" font-size="11.5" fill="#3A3A40">Bunker and hopper charging</text>
  <text x="344" y="414" font-size="10.5" font-weight="700" fill="#808088" letter-spacing="1">PRECONDITION</text>
  <text x="344" y="438" font-size="11.5" fill="#3A3A40">An enclosure or containment</text>
  <text x="344" y="456" font-size="11.5" fill="#3A3A40">must exist; in the open the fog</text>
  <text x="344" y="474" font-size="11.5" fill="#3A3A40">disperses and achieves nothing</text>

  <!-- 3 GATE -->
  <rect x="609" y="104" width="271" height="420" rx="10" fill="#FAF7F2" stroke="#E5DBCB"/>
  <rect x="609" y="104" width="271" height="6" rx="3" fill="#8A6A41"/>
  <text x="633" y="146" font-size="12" font-weight="700" fill="#8A6A41" letter-spacing="1.5">GATE</text>
  <text x="633" y="174" font-size="16.5" font-weight="700" fill="#1F1F23">Wheel wash station</text>
  <text x="633" y="206" font-size="11.5" fill="#4A4A50">Stops material already on tyres</text>
  <text x="633" y="224" font-size="11.5" fill="#4A4A50">and undercarriage from reaching</text>
  <text x="633" y="242" font-size="11.5" fill="#4A4A50">public roads.</text>
  <text x="633" y="286" font-size="10.5" font-weight="700" fill="#808088" letter-spacing="1">WHERE IT BELONGS</text>
  <text x="633" y="310" font-size="11.5" fill="#3A3A40">Yard exits</text>
  <text x="633" y="330" font-size="11.5" fill="#3A3A40">Site gates</text>
  <text x="633" y="350" font-size="11.5" fill="#3A3A40">Departures from internal roads</text>
  <text x="633" y="414" font-size="10.5" font-weight="700" fill="#808088" letter-spacing="1">PRECONDITION</text>
  <text x="633" y="438" font-size="11.5" fill="#3A3A40">Wash water captured and</text>
  <text x="633" y="456" font-size="11.5" fill="#3A3A40">treated; free drainage after</text>
  <text x="633" y="474" font-size="11.5" fill="#3A3A40">the wash; traffic routed through</text>

  <!-- 4 LOOP -->
  <rect x="898" y="104" width="271" height="420" rx="10" fill="#F7F6FA" stroke="#DCD8E5"/>
  <rect x="898" y="104" width="271" height="6" rx="3" fill="#5B4B8A"/>
  <text x="922" y="146" font-size="12" font-weight="700" fill="#5B4B8A" letter-spacing="1.5">LOOP</text>
  <text x="922" y="174" font-size="16.5" font-weight="700" fill="#1F1F23">Control layer</text>
  <text x="922" y="206" font-size="11.5" fill="#4A4A50">Replaces the timer with a</text>
  <text x="922" y="224" font-size="11.5" fill="#4A4A50">detection event, and produces</text>
  <text x="922" y="242" font-size="11.5" fill="#4A4A50">the evidence that it ran.</text>
  <text x="922" y="286" font-size="10.5" font-weight="700" fill="#808088" letter-spacing="1">WHERE IT BELONGS</text>
  <text x="922" y="310" font-size="11.5" fill="#3A3A40">Across all of the above</text>
  <text x="922" y="330" font-size="11.5" fill="#3A3A40">Per-zone, not plant-wide</text>
  <text x="922" y="414" font-size="10.5" font-weight="700" fill="#808088" letter-spacing="1">PRECONDITION</text>
  <text x="922" y="438" font-size="11.5" fill="#3A3A40">Sensors at the source; operator</text>
  <text x="922" y="456" font-size="11.5" fill="#3A3A40">authority preserved; a tuning</text>
  <text x="922" y="474" font-size="11.5" fill="#3A3A40">period budgeted on site</text>

  <text x="31" y="558" font-size="12" fill="#808088">A steelworks usually needs all four. The proportions differ by site, and the sequence in which they are applied matters more than the quantity of any single one.</text>
</svg>
