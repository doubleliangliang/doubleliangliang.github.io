<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" font-family="'Helvetica Neue',Arial,sans-serif">
  <rect width="1200" height="920" fill="#ffffff"/>

  <text x="40" y="46" font-size="23" font-weight="700" fill="#1A1A1A">From Source to Measure: What Goes Where</text>
  <text x="40" y="76" font-size="13.5" fill="#6B6B6B">The measure follows the source, not the budget. Five situations cover most of what a city actually has to deal with.</text>

  <!-- legend -->
  <rect x="40" y="96" width="12" height="12" rx="3" fill="#A31F34"/>
  <text x="60" y="107" font-size="12.5" fill="#4A3A3E">Fog cannon — fixed or vehicle-mounted</text>
  <rect x="330" y="96" width="12" height="12" rx="3" fill="#2E6F8E"/>
  <text x="350" y="107" font-size="12.5" fill="#4A3A3E">Pole-mounted spray line</text>
  <rect x="540" y="96" width="12" height="12" rx="3" fill="#8A6A41"/>
  <text x="560" y="107" font-size="12.5" fill="#4A3A3E">Mechanical sweeping</text>
  <rect x="730" y="96" width="12" height="12" rx="3" fill="#5F5F5F"/>
  <text x="750" y="107" font-size="12.5" fill="#4A3A3E">Monitoring and automatic control</text>

  <!-- header -->
  <text x="56" y="140" font-size="11" font-weight="700" fill="#9A9A9A">SITUATION</text>
  <text x="390" y="140" font-size="11" font-weight="700" fill="#9A9A9A">WHAT MAKES IT DIFFICULT</text>
  <text x="694" y="140" font-size="11" font-weight="700" fill="#9A9A9A">WHAT FITS</text>

  <!-- Row 1 -->
  <rect x="40" y="152" width="1120" height="96" rx="11" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.3"/>
  <rect x="40" y="152" width="4" height="96" rx="2" fill="#A31F34"/>
  <text x="56" y="186" font-size="14" font-weight="700" fill="#A31F34">Demolition and construction sites</text>
  <text x="56" y="208" font-size="11" fill="#4A3A3E">Interrupted and occasionally intense;</text>
  <text x="56" y="226" font-size="11" fill="#4A3A3E">the working face moves as the job moves.</text>
  <text x="390" y="186" font-size="11" fill="#4A3A3E">A single fixed position stops covering the</text>
  <text x="390" y="204" font-size="11" fill="#4A3A3E">source once the site advances beyond it.</text>
  <text x="694" y="186" font-size="12" font-weight="700" fill="#A31F34">Fog cannon on a tower or roof</text>
  <text x="694" y="208" font-size="11" fill="#4A3A3E">plus a mobile vehicle for the working face — cover the area</text>
  <text x="694" y="226" font-size="11" fill="#4A3A3E">from above and follow the job rather than waiting for it.</text>

  <!-- Row 2 -->
  <rect x="40" y="256" width="1120" height="96" rx="11" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.3"/>
  <rect x="40" y="256" width="4" height="96" rx="2" fill="#A31F34"/>
  <text x="56" y="290" font-size="14" font-weight="700" fill="#A31F34">Stockpiles and exposed ground</text>
  <text x="56" y="312" font-size="11" fill="#4A3A3E">Large surface, low plume, shaped by</text>
  <text x="56" y="330" font-size="11" fill="#4A3A3E">wind direction more than by activity.</text>
  <text x="390" y="290" font-size="11" fill="#4A3A3E">The source stays put; it is the wind that</text>
  <text x="390" y="308" font-size="11" fill="#4A3A3E">decides where the dust actually goes.</text>
  <text x="694" y="290" font-size="12" font-weight="700" fill="#A31F34">Fixed fog cannon covering the area</text>
  <text x="694" y="312" font-size="11" fill="#4A3A3E">with surface covering where the material allows it. Aim the</text>
  <text x="694" y="330" font-size="11" fill="#4A3A3E">coverage along the prevailing wind, not at the pile alone.</text>

  <!-- Row 3 -->
  <rect x="40" y="360" width="1120" height="96" rx="11" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.3"/>
  <rect x="40" y="360" width="4" height="96" rx="2" fill="#A31F34"/>
  <text x="56" y="394" font-size="14" font-weight="700" fill="#A31F34">City roads, day to day</text>
  <text x="56" y="416" font-size="11" fill="#4A3A3E">The dust is already on the surface</text>
  <text x="56" y="434" font-size="11" fill="#4A3A3E">before anything is stirred up.</text>
  <text x="390" y="394" font-size="11" fill="#4A3A3E">Water alone moves the dust from the air</text>
  <text x="390" y="412" font-size="11" fill="#4A3A3E">to the gutter, and leaves it there.</text>
  <text x="694" y="394" font-size="12" font-weight="700" fill="#A31F34">Fog cannon vehicle, paired with sweeping</text>
  <text x="694" y="416" font-size="11" fill="#4A3A3E">Suppression brings the dust down; mechanical sweeping takes</text>
  <text x="694" y="434" font-size="11" fill="#4A3A3E">it away. Without the second half it is back in the air by evening.</text>

  <!-- Row 4 -->
  <rect x="40" y="464" width="1120" height="96" rx="11" fill="#F4F7F9" stroke="#D8E3E9" stroke-width="1.3"/>
  <rect x="40" y="464" width="4" height="96" rx="2" fill="#2E6F8E"/>
  <text x="56" y="498" font-size="14" font-weight="700" fill="#2E6F8E">Trunk roads and haul routes</text>
  <text x="56" y="520" font-size="11" fill="#4A3A3E">Long, linear and continuous; material is</text>
  <text x="56" y="538" font-size="11" fill="#4A3A3E">dropped along the whole length, not one point.</text>
  <text x="390" y="498" font-size="11" fill="#4A3A3E">A vehicle loop cannot keep up: refilling,</text>
  <text x="390" y="516" font-size="11" fill="#4A3A3E">scheduling, lane occupation, water and fuel.</text>
  <text x="694" y="498" font-size="12" font-weight="700" fill="#2E6F8E">Pole-mounted spray line, 25–50 m spacing</text>
  <text x="694" y="520" font-size="11" fill="#4A3A3E">Mounted high on street-lighting or dedicated poles, forming a</text>
  <text x="694" y="538" font-size="11" fill="#4A3A3E">continuous curtain along the road rather than a passing wet stripe.</text>

  <!-- Row 5 -->
  <rect x="40" y="568" width="1120" height="96" rx="11" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1.3"/>
  <rect x="40" y="568" width="4" height="96" rx="2" fill="#5F5F5F"/>
  <text x="56" y="602" font-size="14" font-weight="700" fill="#5F5F5F">All of the above, at the same time</text>
  <text x="56" y="624" font-size="11" fill="#4A3A3E">Nobody on site knows which section needs</text>
  <text x="56" y="642" font-size="11" fill="#4A3A3E">water in the next ten minutes.</text>
  <text x="390" y="602" font-size="11" fill="#4A3A3E">A timer sprays by the clock, so water and</text>
  <text x="390" y="620" font-size="11" fill="#4A3A3E">power are spent whether dust is present or not.</text>
  <text x="694" y="602" font-size="12" font-weight="700" fill="#5F5F5F">Segment-level air monitoring + camera recognition</text>
  <text x="694" y="624" font-size="11" fill="#4A3A3E">Each road segment measures its own PM10, PM2.5 and weather,</text>
  <text x="694" y="642" font-size="11" fill="#4A3A3E">and starts only the zones that need it, for as long as they need it.</text>

  <!-- Closing loop -->
  <rect x="40" y="684" width="1120" height="196" rx="12" fill="#FAFAFA" stroke="#E6E6E6" stroke-width="1.5"/>
  <text x="64" y="718" font-size="15" font-weight="700" fill="#1A1A1A">The control loop that replaces the timer</text>

  <rect x="64" y="736" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#DADADA" stroke-width="1.2"/>
  <text x="78" y="762" font-size="12" font-weight="700" fill="#1A1A1A">Monitor</text>
  <text x="78" y="782" font-size="10.5" fill="#6B6B6B">PM10, PM2.5, wind, cameras</text>

  <rect x="280" y="736" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#DADADA" stroke-width="1.2"/>
  <text x="294" y="762" font-size="12" font-weight="700" fill="#1A1A1A">Decide</text>
  <text x="294" y="782" font-size="10.5" fill="#6B6B6B">Is dust being generated? Where?</text>

  <rect x="496" y="736" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#DADADA" stroke-width="1.2"/>
  <text x="510" y="762" font-size="12" font-weight="700" fill="#1A1A1A">Act</text>
  <text x="510" y="782" font-size="10.5" fill="#6B6B6B">Only the affected zone runs</text>

  <rect x="712" y="736" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#DADADA" stroke-width="1.2"/>
  <text x="726" y="762" font-size="12" font-weight="700" fill="#1A1A1A">Verify</text>
  <text x="726" y="782" font-size="10.5" fill="#6B6B6B">Same sensors, after the run</text>

  <rect x="928" y="736" width="208" height="62" rx="9" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.2"/>
  <text x="942" y="762" font-size="12" font-weight="700" fill="#A31F34">Record</text>
  <text x="942" y="782" font-size="10.5" fill="#8A5A66">Runs and alarms, per zone, per shift</text>

  <text x="64" y="832" font-size="12" font-weight="700" fill="#A31F34">The number this produces is also the number an inspection asks for:</text>
  <text x="64" y="854" font-size="11.5" fill="#4A3A3E">visible dust-escape events per zone, per week. A timer cannot produce it. A monitoring and control loop can.</text>
</svg>
