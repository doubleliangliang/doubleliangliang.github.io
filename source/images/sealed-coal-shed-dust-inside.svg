<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <rect width="1200" height="820" fill="#FFFFFF"/>

  <text x="40" y="58" font-size="23" font-weight="700" fill="#1F1F1F">What Happens Inside a Sealed Coal Shed</text>
  <text x="40" y="88" font-size="13.5" fill="#5F5F5F">The dust sources are unchanged. The wind is gone. The boundary is a wall.</text>
  <line x1="40" y1="110" x2="1160" y2="110" stroke="#E2E2E2" stroke-width="1"/>

  <!-- building -->
  <polygon points="300,650 300,300 600,180 900,300 900,650" fill="#F4F2EF" stroke="#9A938A" stroke-width="2"/>
  <!-- gas layer at top -->
  <polygon points="320,292 600,190 880,292" fill="#9BB7C7" fill-opacity="0.35"/>
  <!-- dust haze -->
  <ellipse cx="470" cy="400" rx="150" ry="80" fill="#C9BFAE" fill-opacity="0.30"/>
  <ellipse cx="720" cy="360" rx="130" ry="70" fill="#C9BFAE" fill-opacity="0.26"/>
  <ellipse cx="600" cy="480" rx="200" ry="70" fill="#C9BFAE" fill-opacity="0.22"/>
  <!-- coal pile -->
  <polygon points="380,650 820,650 760,520 440,520" fill="#6E6259"/>
  <!-- hot spots in dead corners -->
  <circle cx="400" cy="638" r="20" fill="#C08A5A" fill-opacity="0.75"/>
  <circle cx="800" cy="638" r="20" fill="#C08A5A" fill-opacity="0.75"/>
  <!-- settled dust along floor -->
  <rect x="300" y="646" width="600" height="6" fill="#A79C8C"/>

  <!-- left callouts -->
  <rect x="20" y="180" width="252" height="86" rx="6" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="1.5"/>
  <text x="36" y="208" font-size="12.5" font-weight="700" fill="#1F1F1F">Settled dust on steelwork</text>
  <text x="36" y="228" font-size="12" fill="#4A4A4A">Fine coal deposits on the roof</text>
  <text x="36" y="246" font-size="12" fill="#4A4A4A">structure, ledges and ducts.</text>
  <line x1="272" y1="223" x2="372" y2="266" stroke="#9A938A" stroke-width="1.5"/>

  <rect x="20" y="330" width="252" height="86" rx="6" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="1.5"/>
  <text x="36" y="358" font-size="12.5" font-weight="700" fill="#1F1F1F">Settled dust is the inventory</text>
  <text x="36" y="378" font-size="12" fill="#4A4A4A">Re-suspended by vehicles,</text>
  <text x="36" y="396" font-size="12" fill="#4A4A4A">vibration and dry sweeping.</text>
  <line x1="272" y1="373" x2="336" y2="470" stroke="#9A938A" stroke-width="1.5"/>

  <rect x="20" y="480" width="252" height="86" rx="6" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="1.5"/>
  <text x="36" y="508" font-size="12.5" font-weight="700" fill="#1F1F1F">Respirable dust at low level</text>
  <text x="36" y="528" font-size="12" fill="#4A4A4A">Where people actually work,</text>
  <text x="36" y="546" font-size="12" fill="#4A4A4A">with the least fresh air.</text>
  <line x1="272" y1="523" x2="398" y2="560" stroke="#9A938A" stroke-width="1.5"/>

  <!-- right callouts -->
  <rect x="928" y="180" width="252" height="86" rx="6" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="1.5"/>
  <text x="944" y="208" font-size="12.5" font-weight="700" fill="#1F1F1F">Methane at the highest point</text>
  <text x="944" y="228" font-size="12" fill="#4A4A4A">Lighter than air, it collects</text>
  <text x="944" y="246" font-size="12" fill="#4A4A4A">under the apex of the roof.</text>
  <line x1="928" y1="223" x2="828" y2="266" stroke="#9A938A" stroke-width="1.5"/>

  <rect x="928" y="330" width="252" height="86" rx="6" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="1.5"/>
  <text x="944" y="358" font-size="12.5" font-weight="700" fill="#1F1F1F">Self-heating in dead zones</text>
  <text x="944" y="378" font-size="12" fill="#4A4A4A">Material the reclaimer cannot</text>
  <text x="944" y="396" font-size="12" fill="#4A4A4A">reach sits and oxidises.</text>
  <line x1="928" y1="373" x2="864" y2="470" stroke="#9A938A" stroke-width="1.5"/>

  <rect x="928" y="480" width="252" height="86" rx="6" fill="#FFFFFF" stroke="#D8D2C8" stroke-width="1.5"/>
  <text x="944" y="508" font-size="12.5" font-weight="700" fill="#1F1F1F">Machinery and visibility</text>
  <text x="944" y="528" font-size="12" fill="#4A4A4A">Dust in bearings, radiators and</text>
  <text x="944" y="546" font-size="12" fill="#4A4A4A">panels; sight lines shorten.</text>
  <line x1="928" y1="523" x2="802" y2="560" stroke="#9A938A" stroke-width="1.5"/>

  <text x="40" y="766" font-size="13" fill="#5F5F5F">Nothing escapes the building — not the heat, not the gas, and not the fine dust that settles at working height.</text>
</svg>
