<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#0f172a">Fog Cannon or Dry Fog: Selecting by Droplet Spectrum and Water Budget</text>
  <text x="40" y="72" font-size="15" fill="#64748b">The two technologies differ in droplet size, throw distance and, above all, in how much water they add to the coal</text>

  <!-- axis -->
  <rect x="90" y="120" width="850" height="86" rx="8" fill="#fbfdff" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="90" y1="163" x2="940" y2="163" stroke="#cbd5e1" stroke-width="2"/>

  <!-- log scale ticks: 1um at 90, 1000um at 940 ; 3 decades -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="90" y="188">1</text>
    <text x="373" y="188">10</text>
    <text x="657" y="188">100</text>
    <text x="940" y="188">1000</text>
  </g>
  <text x="515" y="228" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Droplet diameter (micron, log scale)</text>

  <!-- dry fog band 5-10 um : x = 90 + 283*log10(d) -->
  <!-- log10(5)=0.699 -> 90+283*0.699=287.8 ; log10(10)=1 -> 373 -->
  <rect x="288" y="132" width="85" height="62" rx="6" fill="#0d9488" opacity="0.9"/>
  <text x="330" y="158" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Dry fog</text>
  <text x="330" y="176" font-size="12" fill="#ffffff" text-anchor="middle">5 - 10 um</text>

  <!-- micro mist 10-50 : log10(50)=1.699 -> 90+283*1.699=570.8 -->
  <rect x="373" y="132" width="198" height="62" rx="6" fill="#22d3ee" opacity="0.85"/>
  <text x="472" y="158" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Micro mist</text>
  <text x="472" y="176" font-size="12" fill="#0f172a" text-anchor="middle">10 - 50 um</text>

  <!-- cannon fine 50-200 : log10(200)=2.301 -> 90+283*2.301=741.2 -->
  <rect x="571" y="132" width="170" height="62" rx="6" fill="#f59e0b" opacity="0.9"/>
  <text x="656" y="158" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Fog cannon spray</text>
  <text x="656" y="176" font-size="12" fill="#ffffff" text-anchor="middle">50 - 200 um</text>

  <!-- coarse >200 -->
  <rect x="741" y="132" width="199" height="62" rx="6" fill="#94a3b8" opacity="0.75"/>
  <text x="840" y="158" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Coarse wetting spray</text>
  <text x="840" y="176" font-size="12" fill="#ffffff" text-anchor="middle">above 200 um</text>

  <!-- PM10 / PM2.5 zone -->
  <rect x="90" y="102" width="571" height="18" fill="#fff1f2"/>
  <text x="375" y="116" font-size="12" font-weight="700" fill="#9f1239" text-anchor="middle">Respirable range PM10 - PM2.5: only fine droplets capture effectively</text>

  <!-- comparison table -->
  <text x="40" y="272" font-size="15" font-weight="700" fill="#0f172a">What changes with the choice</text>

  <rect x="40" y="288" width="460" height="230" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="2"/>
  <text x="270" y="316" font-size="16" font-weight="700" fill="#115e59" text-anchor="middle">Dry fog system</text>
  <line x1="64" y1="330" x2="476" y2="330" stroke="#99f6e4" stroke-width="1.5"/>

  <g font-size="13" fill="#334155">
    <text x="64" y="356" font-weight="700" fill="#115e59">Droplet</text>
    <text x="200" y="356">5 - 10 micron, close to PM10 size</text>
    <text x="64" y="386" font-weight="700" fill="#115e59">Range</text>
    <text x="200" y="386">Short. Must sit at the dust source.</text>
    <text x="64" y="416" font-weight="700" fill="#115e59">Water use</text>
    <text x="200" y="416">Very low. Moisture increase is minimal.</text>
    <text x="64" y="446" font-weight="700" fill="#115e59">Best at</text>
    <text x="200" y="446">Tippler, transfer point, crusher</text>
    <text x="64" y="476" font-weight="700" fill="#115e59">Watch for</text>
    <text x="200" y="476">Nozzle clogging, water quality</text>
    <text x="64" y="506" font-weight="700" fill="#115e59">Coal impact</text>
    <text x="200" y="506">Keeps total moisture within limits</text>
  </g>

  <rect x="500" y="288" width="460" height="230" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="730" y="316" font-size="16" font-weight="700" fill="#9a3412" text-anchor="middle">Long-range fog cannon</text>
  <line x1="524" y1="330" x2="936" y2="330" stroke="#fed7aa" stroke-width="1.5"/>

  <g font-size="13" fill="#334155">
    <text x="524" y="356" font-weight="700" fill="#9a3412">Droplet</text>
    <text x="660" y="356">50 - 200 micron, knocks plumes down</text>
    <text x="524" y="386" font-weight="700" fill="#9a3412">Range</text>
    <text x="660" y="386">Tens to hundreds of metres</text>
    <text x="524" y="416" font-weight="700" fill="#9a3412">Water use</text>
    <text x="660" y="416">Higher. Needs a moisture ceiling.</text>
    <text x="524" y="446" font-weight="700" fill="#9a3412">Best at</text>
    <text x="660" y="446">Open yard, dome, unloading area</text>
    <text x="524" y="476" font-weight="700" fill="#9a3412">Watch for</text>
    <text x="660" y="476">Wind drift, icing, coverage gaps</text>
    <text x="524" y="506" font-weight="700" fill="#9a3412">Coal impact</text>
    <text x="660" y="506">Surface wetting only if metered</text>
  </g>

  <rect x="40" y="534" width="920" height="60" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="558" font-size="13.5" font-weight="700" fill="#0f172a">Engineering takeaway</text>
  <text x="60" y="580" font-size="13.5" fill="#475569">Fine droplets win on capture but lose on distance. Decide by how close you can put a nozzle, and by how much water the coal can accept.</text>

  <text x="40" y="628" font-size="12.5" fill="#94a3b8">Schematic selection guide. Droplet bands are indicative; actual spectrum depends on nozzle type, pressure and air supply.</text>
</svg>
