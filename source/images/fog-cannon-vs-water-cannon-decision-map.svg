<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="860" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="25" font-weight="bold" fill="#1F2933">Eight Checks, in This Order</text>
  <text x="40" y="72" font-size="15" fill="#5F6B76">Step 1 can end the process on its own. Everything after it only matters if step 1 passed.</text>

  <rect x="856" y="28" width="16" height="16" rx="3" fill="#2E6F8E"/>
  <text x="880" y="41" font-size="13" fill="#3E4C59">Fog system</text>
  <rect x="976" y="28" width="16" height="16" rx="3" fill="#A31F34"/>
  <text x="1000" y="41" font-size="13" fill="#3E4C59">Water cannon</text>
  <rect x="1096" y="28" width="16" height="16" rx="3" fill="#8A6A41"/>
  <text x="1120" y="41" font-size="13" fill="#3E4C59">Neither</text>

  <rect x="40" y="94" width="1120" height="92" rx="8" fill="#FBF1F3" stroke="#A31F34" stroke-width="2"/>
  <circle cx="74" cy="140" r="18" fill="#A31F34"/>
  <text x="74" y="147" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="108" y="126" font-size="17" font-weight="bold" fill="#1F2933">What is the droplet spectrum on offer?</text>
  <text x="108" y="150" font-size="13" fill="#5F6B76">Ask every supplier for it in writing. Below 20 um will not settle; above 150 um falls past</text>
  <text x="108" y="170" font-size="13" fill="#5F6B76">the dust. Neither belongs in open-area suppression, and neither can be fixed by aiming.</text>
  <rect x="846" y="118" width="130" height="32" rx="16" fill="#2E6F8E"/>
  <text x="911" y="139" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">30-100 um</text>
  <rect x="988" y="118" width="160" height="32" rx="16" fill="#A31F34"/>
  <text x="1068" y="139" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A wet yard, not dust</text>

  <rect x="40" y="196" width="1120" height="82" rx="8" fill="#F5F8FB" stroke="#DDE6EC"/>
  <circle cx="74" cy="237" r="18" fill="#8A6A41"/>
  <text x="74" y="244" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="108" y="224" font-size="17" font-weight="bold" fill="#1F2933">List every emission point. Open, sheltered, or enclosed?</text>
  <text x="108" y="248" font-size="13" fill="#5F6B76">Enclosed points leave this comparison entirely. A fog cloud needs somewhere to travel.</text>
  <text x="108" y="268" font-size="13" fill="#5F6B76">Coarse spray inside a semi-enclosed space raises humidity and adds slurry, not clean air.</text>
  <rect x="846" y="216" width="120" height="32" rx="16" fill="#2E6F8E"/>
  <text x="906" y="237" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">open air</text>
  <rect x="978" y="216" width="170" height="32" rx="16" fill="#8A6A41"/>
  <text x="1063" y="237" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">capture or dry fog</text>

  <rect x="40" y="288" width="1120" height="82" rx="8" fill="#F5F8FB" stroke="#DDE6EC"/>
  <circle cx="74" cy="329" r="18" fill="#2E6F8E"/>
  <text x="74" y="336" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="108" y="316" font-size="17" font-weight="bold" fill="#1F2933">How far, to the far edge of the emission zone?</text>
  <text x="108" y="340" font-size="13" fill="#5F6B76">This is the sizing variable — but only inside the fog family. Not to the centre of the pile.</text>
  <text x="108" y="360" font-size="13" fill="#5F6B76">Close does not mean coarse: at short range there is no travel time to slow a heavy droplet.</text>
  <rect x="846" y="308" width="292" height="32" rx="16" fill="#EAF2F7" stroke="#2E6F8E"/>
  <text x="992" y="329" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="middle">choose the model by throw distance</text>

  <rect x="40" y="380" width="1120" height="82" rx="8" fill="#F5F8FB" stroke="#DDE6EC"/>
  <circle cx="74" cy="421" r="18" fill="#8A6A41"/>
  <text x="74" y="428" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="108" y="408" font-size="17" font-weight="bold" fill="#1F2933">Can the material be allowed to get wet?</text>
  <text x="108" y="432" font-size="13" fill="#5F6B76">Water is a tool before the process boundary and a defect after it. Cement after the mill is</text>
  <text x="108" y="452" font-size="13" fill="#5F6B76">the standard example. Tolerating wetting does NOT relax the droplet requirement.</text>
  <rect x="846" y="400" width="292" height="32" rx="16" fill="#EDF1F4"/>
  <text x="992" y="421" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="middle">find the boundary before comparing machines</text>

  <rect x="40" y="472" width="1120" height="82" rx="8" fill="#F5F8FB" stroke="#DDE6EC"/>
  <circle cx="74" cy="513" r="18" fill="#2E6F8E"/>
  <text x="74" y="520" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="108" y="500" font-size="17" font-weight="bold" fill="#1F2933">Does spray volume exceed the dust generated?</text>
  <text x="108" y="524" font-size="13" fill="#5F6B76">The second of three requirements, and the one most often assumed away. Correct droplet size</text>
  <text x="108" y="544" font-size="13" fill="#5F6B76">at one tenth of the required volume fails exactly the same way as the wrong size does.</text>
  <rect x="846" y="492" width="292" height="32" rx="16" fill="#EAF2F7" stroke="#2E6F8E"/>
  <text x="992" y="513" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="middle">size against generation rate, not nozzle rating</text>

  <rect x="40" y="564" width="1120" height="82" rx="8" fill="#F5F8FB" stroke="#DDE6EC"/>
  <circle cx="74" cy="605" r="18" fill="#2E6F8E"/>
  <text x="74" y="612" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="108" y="592" font-size="17" font-weight="bold" fill="#1F2933">What does the wind actually do here, by season?</text>
  <text x="108" y="616" font-size="13" fill="#5F6B76">Record direction and speed. This sets how many azimuth positions are needed and which</text>
  <text x="108" y="636" font-size="13" fill="#5F6B76">sheltered zones need a second unit. One day of observation beats a year of assumption.</text>
  <rect x="846" y="584" width="292" height="32" rx="16" fill="#EAF2F7" stroke="#2E6F8E"/>
  <text x="992" y="605" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="middle">sets azimuth count and sheltered gaps</text>

  <rect x="40" y="656" width="1120" height="82" rx="8" fill="#F5F8FB" stroke="#DDE6EC"/>
  <circle cx="74" cy="697" r="18" fill="#8A6A41"/>
  <text x="74" y="704" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">7</text>
  <text x="108" y="684" font-size="17" font-weight="bold" fill="#1F2933">Power, water quality, winter freeze, and who starts it?</text>
  <text x="108" y="708" font-size="13" fill="#5F6B76">Every remaining constraint, and it becomes numbers: connected load, hardness, freeze</text>
  <text x="108" y="728" font-size="13" fill="#5F6B76">exposure, and whether the coverage is unattended or attended.</text>
  <rect x="846" y="676" width="292" height="32" rx="16" fill="#EDF1F4"/>
  <text x="992" y="697" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="middle">baseline unattended vs attended response</text>

  <rect x="40" y="748" width="1120" height="82" rx="8" fill="#F5F8FB" stroke="#DDE6EC"/>
  <circle cx="74" cy="789" r="18" fill="#1F2933"/>
  <text x="74" y="796" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">8</text>
  <text x="108" y="776" font-size="17" font-weight="bold" fill="#1F2933">Then, and only then, choose the machine</text>
  <text x="108" y="800" font-size="13" fill="#5F6B76">Specify by throw distance and atomisation performance. Never by output power.</text>
  <rect x="846" y="768" width="292" height="32" rx="16" fill="#EDF1F4"/>
  <text x="992" y="789" font-size="13" font-weight="bold" fill="#1F2933" text-anchor="middle">seven of the eight checks cost nothing</text>

  <rect x="40" y="844" width="1120" height="2" fill="#DDE3E8"/>
</svg>
