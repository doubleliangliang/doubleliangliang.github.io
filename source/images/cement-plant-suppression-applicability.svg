<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="740" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#1A1A1A">Where Fog Cannons and Dry Fog Actually Work</text>
  <text x="40" y="76" font-size="14" fill="#6B6B6B">Every source in a cement plant falls into one of four groups. The group, not the machine size, decides what can be used.</text>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#B9B9B9"/>
    </marker>
  </defs>

  <!-- ROW 1 : FOG CANNON -->
  <rect x="40" y="104" width="300" height="140" rx="12" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="62" y="132" font-size="10" fill="#9A9A9A" letter-spacing="1.3">GROUP 01</text>
  <text x="62" y="164" font-size="15" font-weight="700" fill="#1A1A1A">Open, coarse,</text>
  <text x="62" y="186" font-size="15" font-weight="700" fill="#1A1A1A">wind-driven dust</text>
  <line x1="348" y1="174" x2="424" y2="174" stroke="#B9B9B9" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="436" y="104" width="724" height="140" rx="12" fill="#FDF3F5" stroke="#F0D6DC" stroke-width="1.5"/>
  <rect x="436" y="104" width="6" height="140" rx="3" fill="#A31F34"/>
  <text x="466" y="140" font-size="16" font-weight="700" fill="#A31F34">Long-range fog cannon</text>
  <text x="466" y="168" font-size="12.5" fill="#4A3A3E">Quarry · crushing apron · pre-homogenising yard · clinker stockpiles · plant and haul roads</text>
  <text x="466" y="190" font-size="12.5" fill="#4A3A3E">Reach and coverage matter more than droplet fineness. Water is tolerated here because</text>
  <text x="466" y="212" font-size="12.5" fill="#4A3A3E">the material is still upstream of the mill, but the volume still has to be budgeted.</text>

  <!-- ROW 2 : DRY FOG -->
  <rect x="40" y="258" width="300" height="140" rx="12" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="62" y="286" font-size="10" fill="#9A9A9A" letter-spacing="1.3">GROUP 02</text>
  <text x="62" y="318" font-size="15" font-weight="700" fill="#1A1A1A">Enclosed, very</text>
  <text x="62" y="340" font-size="15" font-weight="700" fill="#1A1A1A">fine, sticky dust</text>
  <line x1="348" y1="328" x2="424" y2="328" stroke="#B9B9B9" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="436" y="258" width="724" height="140" rx="12" fill="#EFF5F9" stroke="#CFE0EA" stroke-width="1.5"/>
  <rect x="436" y="258" width="6" height="140" rx="3" fill="#2E6F8E"/>
  <text x="466" y="294" font-size="16" font-weight="700" fill="#2E6F8E">Dry fog and micro-mist</text>
  <text x="466" y="322" font-size="12.5" fill="#28566E">Belt transfer points · bucket elevators · mill feed and discharge · raw meal silo tops</text>
  <text x="466" y="344" font-size="12.5" fill="#28566E">1–10 µm droplets evaporate in the air stream and agglomerate fine dust without wetting</text>
  <text x="466" y="366" font-size="12.5" fill="#28566E">the belt or the product. A confined space is the precondition, not an option.</text>

  <!-- ROW 3 : NOT A SPRAY JOB -->
  <rect x="40" y="412" width="300" height="140" rx="12" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="62" y="440" font-size="10" fill="#9A9A9A" letter-spacing="1.3">GROUP 03</text>
  <text x="62" y="472" font-size="15" font-weight="700" fill="#1A1A1A">The dust is the</text>
  <text x="62" y="494" font-size="15" font-weight="700" fill="#1A1A1A">product itself</text>
  <line x1="348" y1="482" x2="424" y2="482" stroke="#B9B9B9" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="436" y="412" width="724" height="140" rx="12" fill="#FAF4EC" stroke="#E7DAC7" stroke-width="1.5"/>
  <rect x="436" y="412" width="6" height="140" rx="3" fill="#8A6A41"/>
  <text x="466" y="448" font-size="16" font-weight="700" fill="#8A6A41">Not a spray job — enclosure and negative pressure</text>
  <text x="466" y="476" font-size="12.5" fill="#6B5233">Cement mill · separators · cement silos · dispatch chutes · packers · loading heads</text>
  <text x="466" y="498" font-size="12.5" fill="#6B5233">Finished cement sets when it gets wet. Added water downstream of the mill is pre-hydration:</text>
  <text x="466" y="520" font-size="12.5" fill="#6B5233">caking, blocked chutes, strength loss. Capture and inward pressure do the work.</text>

  <!-- ROW 4 : COMBUSTIBLE -->
  <rect x="40" y="566" width="300" height="140" rx="12" fill="#F7F7F7" stroke="#E0E0E0" stroke-width="1.5"/>
  <text x="62" y="594" font-size="10" fill="#9A9A9A" letter-spacing="1.3">GROUP 04</text>
  <text x="62" y="626" font-size="15" font-weight="700" fill="#1A1A1A">Combustible dust</text>
  <line x1="348" y1="636" x2="424" y2="636" stroke="#B9B9B9" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="436" y="566" width="724" height="140" rx="12" fill="#F4F4F4" stroke="#E0E0E0" stroke-width="1.5"/>
  <rect x="436" y="566" width="6" height="140" rx="3" fill="#5F5F5F"/>
  <text x="466" y="602" font-size="16" font-weight="700" fill="#5F5F5F">Protection matched to the application</text>
  <text x="466" y="630" font-size="12.5" fill="#4A4A4A">Coal yard · coal mill · coal silo. A suspended coal cloud is itself the hazard, so the reflex</text>
  <text x="466" y="652" font-size="12.5" fill="#4A4A4A">of blowing dust off with compressed air is precisely wrong. Wet or vacuum housekeeping;</text>
  <text x="466" y="674" font-size="12.5" fill="#4A4A4A">Ex configurations per application, with the protection type and certificate with the project.</text>
</svg>
