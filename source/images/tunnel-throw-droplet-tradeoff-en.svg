<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="60" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1F2933">To Throw Further, the Standard Lets the Droplets Get Coarser</text>
  <text x="60" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5F5F5F">Throw distance and droplet diameter are specified together in JB/T 13562—2018, because one is bought with the other. Read the curve before the first column.</text>

  <line x1="160" y1="470" x2="1080" y2="470" stroke="#1F2933" stroke-width="1.2"/>
  <line x1="160" y1="150" x2="160" y2="470" stroke="#1F2933" stroke-width="1.2"/>

  <g stroke="#E7E3DE" stroke-width="1">
    <line x1="160" y1="406" x2="1080" y2="406"/>
    <line x1="160" y1="342" x2="1080" y2="342"/>
    <line x1="160" y1="278" x2="1080" y2="278"/>
    <line x1="160" y1="214" x2="1080" y2="214"/>
    <line x1="160" y1="150" x2="1080" y2="150"/>
  </g>

  <text x="148" y="474" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">0</text>
  <text x="148" y="410" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">50</text>
  <text x="148" y="346" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">100</text>
  <text x="148" y="282" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">150</text>
  <text x="148" y="218" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">200</text>
  <text x="148" y="154" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">250</text>
  <text x="64" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933" text-anchor="middle" transform="rotate(-90 64 310)">Max droplet diameter (µm)</text>

  <text x="285" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">30</text>
  <text x="369" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">50</text>
  <text x="494" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">80</text>
  <text x="578" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">100</text>
  <text x="662" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">120</text>
  <text x="787" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">150</text>
  <text x="996" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">200</text>
  <text x="620" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933" text-anchor="middle">Rated horizontal throw distance (m)</text>

  <path d="M285 333 L369 333 L369 321 L411 321 L411 299 L494 299 L494 264 L578 264 L578 241 L662 241 L662 184 L787 184 L787 184 L996 184"
        fill="none" stroke="#A31F34" stroke-width="3" stroke-linejoin="miter"/>

  <circle cx="285" cy="333" r="4.5" fill="#FFFFFF" stroke="#A31F34" stroke-width="2.5"/>
  <circle cx="369" cy="333" r="4.5" fill="#FFFFFF" stroke="#A31F34" stroke-width="2.5"/>
  <circle cx="411" cy="321" r="4.5" fill="#FFFFFF" stroke="#A31F34" stroke-width="2.5"/>
  <circle cx="494" cy="299" r="4.5" fill="#FFFFFF" stroke="#A31F34" stroke-width="2.5"/>
  <circle cx="578" cy="264" r="4.5" fill="#FFFFFF" stroke="#A31F34" stroke-width="2.5"/>
  <circle cx="662" cy="241" r="4.5" fill="#FFFFFF" stroke="#A31F34" stroke-width="2.5"/>
  <circle cx="787" cy="184" r="4.5" fill="#FFFFFF" stroke="#A31F34" stroke-width="2.5"/>
  <circle cx="996" cy="184" r="4.5" fill="#FFFFFF" stroke="#A31F34" stroke-width="2.5"/>

  <text x="285" y="322" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#A31F34" text-anchor="middle">&lt;120</text>
  <text x="369" y="322" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#A31F34" text-anchor="middle">&lt;120</text>
  <text x="413" y="312" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#A31F34">&lt;130</text>
  <text x="496" y="290" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#A31F34">&lt;150</text>
  <text x="580" y="255" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#A31F34">&lt;180</text>
  <text x="664" y="232" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#A31F34">&lt;200</text>
  <text x="789" y="175" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#A31F34">&lt;250</text>

  <line x1="160" y1="462" x2="1080" y2="462" stroke="#2E6F8E" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="170" y="440" width="212" height="18" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="176" y="454" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#2E6F8E">respirable dust: below 5 µm</text>

  <line x1="996" y1="184" x2="1046" y2="184" stroke="#A31F34" stroke-width="1"/>
  <line x1="996" y1="462" x2="1046" y2="462" stroke="#2E6F8E" stroke-width="1"/>
  <line x1="1040" y1="190" x2="1040" y2="456" stroke="#1F2933" stroke-width="1.4"/>
  <path d="M1036 196 L1040 188 L1044 196" stroke="#1F2933" stroke-width="1.4" fill="none"/>
  <path d="M1036 450 L1040 458 L1044 450" stroke="#1F2933" stroke-width="1.4" fill="none"/>
  <text x="1054" y="300" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1F2933">50×</text>
  <text x="1054" y="318" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5F5F5F">the diameter</text>
  <text x="1054" y="332" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5F5F5F">of the particle</text>
  <text x="1054" y="346" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#5F5F5F">it must catch</text>

  <text x="386" y="222" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A8F98">typical tunnel range</text>
  <path d="M470 228 L486 288" stroke="#8A8F98" stroke-width="1" fill="none"/>
  <path d="M481 282 L487 290 L492 282" stroke="#8A8F98" stroke-width="1" fill="none"/>

  <rect x="60" y="540" width="1080" height="114" rx="6" fill="#FAF8F6" stroke="#E7E3DE" stroke-width="1.2"/>
  <rect x="60" y="540" width="6" height="114" fill="#A31F34"/>
  <text x="88" y="568" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1F2933">What this means at the tunnel face</text>
  <text x="88" y="592" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5F5F">A 200 m machine is permitted 250 µm droplets; a 50 m machine is held below 120 µm.</text>
  <text x="88" y="610" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5F5F5F">Where the dust is mostly below 5 µm, the short-range fine-droplet machine captures more of what reaches the lungs.</text>
  <text x="88" y="636" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#A31F34">Specify the droplet diameter first. Then ask how far it throws.</text>

  <text x="60" y="682" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98">Source: JB/T 13562—2018, Table 1 — rated throw distance, spray flow, droplet diameter and fan outlet velocity. Values shown are the upper limits permitted at each rating.</text>
</svg>
