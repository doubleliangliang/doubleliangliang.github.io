<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="60" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1F2933">When the Mist Starts Matters More Than What You Buy</text>
  <text x="60" y="78" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#5F5F5F">Same tunnel, same dust, three operating strategies. Starting before the blast cut the clearance time by 43% and more than doubled fine-particle removal.</text>

  <line x1="160" y1="470" x2="1080" y2="470" stroke="#1F2933" stroke-width="1.2"/>
  <line x1="160" y1="160" x2="160" y2="470" stroke="#1F2933" stroke-width="1.2"/>

  <g stroke="#E7E3DE" stroke-width="1">
    <line x1="160" y1="245" x2="1080" y2="245"/>
    <line x1="160" y1="320" x2="1080" y2="320"/>
    <line x1="160" y1="395" x2="1080" y2="395"/>
  </g>

  <text x="148" y="474" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">0</text>
  <text x="148" y="399" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">25</text>
  <text x="148" y="324" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">50</text>
  <text x="148" y="249" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">75</text>
  <text x="148" y="174" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="end">100</text>
  <text x="66" y="315" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933" text-anchor="middle" transform="rotate(-90 66 315)">PM10 as % of peak</text>

  <text x="160" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">0</text>
  <text x="313" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">10</text>
  <text x="467" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">20</text>
  <text x="620" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">30</text>
  <text x="773" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">40</text>
  <text x="927" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">50</text>
  <text x="1080" y="492" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98" text-anchor="middle">60</text>
  <text x="620" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1F2933" text-anchor="middle">Minutes after the blast</text>

  <line x1="160" y1="440" x2="1080" y2="440" stroke="#2F6B3A" stroke-width="1.6" stroke-dasharray="6 4"/>
  <rect x="170" y="424" width="196" height="16" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="174" y="436" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#2F6B3A">engineering clearance threshold</text>

  <path d="M160 170 C 380 215 700 350 972 440" fill="none" stroke="#8A8F98" stroke-width="2.5"/>
  <path d="M160 170 C 350 210 520 290 620 330 C 690 375 740 412 773 440" fill="none" stroke="#2E6F8E" stroke-width="2.5"/>
  <path d="M160 170 C 300 232 470 360 620 440" fill="none" stroke="#A31F34" stroke-width="3"/>

  <line x1="620" y1="172" x2="620" y2="440" stroke="#8A8F98" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="628" y="176" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98">late start (after 30 min)</text>

  <circle cx="620" cy="440" r="5" fill="#A31F34"/>
  <circle cx="773" cy="440" r="5" fill="#2E6F8E"/>
  <circle cx="972" cy="440" r="5" fill="#8A8F98"/>

  <text x="620" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#A31F34" text-anchor="middle">30 min</text>
  <text x="773" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#2E6F8E" text-anchor="middle">40 min</text>
  <text x="972" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#5F5F5F" text-anchor="middle">53 min</text>

  <text x="432" y="382" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#A31F34">mist on before blast</text>
  <path d="M436 372 L466 344" stroke="#A31F34" stroke-width="1" fill="none"/>
  <text x="712" y="326" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#2E6F8E">mist on at +30 min</text>
  <text x="820" y="306" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#5F5F5F">ventilation only</text>

  <rect x="60" y="536" width="336" height="120" rx="6" fill="#FAF8F6" stroke="#E7E3DE" stroke-width="1.2"/>
  <rect x="60" y="536" width="6" height="120" fill="#8A8F98"/>
  <text x="84" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#5F5F5F">Ventilation only</text>
  <text x="84" y="596" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#8A8F98">44.9%</text>
  <text x="84" y="616" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5F5F5F">PM10 removal · 53 min to clear</text>
  <text x="84" y="638" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A8F98">PM2.5 removal: 7.13%</text>

  <rect x="412" y="536" width="336" height="120" rx="6" fill="#FAF8F6" stroke="#E7E3DE" stroke-width="1.2"/>
  <rect x="412" y="536" width="6" height="120" fill="#2E6F8E"/>
  <text x="436" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#2E6F8E">Mist on at +30 min</text>
  <text x="436" y="596" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#2E6F8E">77.8%</text>
  <text x="436" y="616" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5F5F5F">PM10 removal · 40 min to clear</text>
  <text x="436" y="638" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#8A8F98">PM2.5 removal: 61.95%</text>

  <rect x="764" y="536" width="376" height="120" rx="6" fill="#FAF8F6" stroke="#A31F34" stroke-width="1.4"/>
  <rect x="764" y="536" width="6" height="120" fill="#A31F34"/>
  <text x="788" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#A31F34">Mist on before the blast</text>
  <text x="788" y="596" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#A31F34">95.56%</text>
  <text x="788" y="616" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5F5F5F">PM10 removal · 30 min to clear</text>
  <text x="788" y="638" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#A31F34">PM2.5 removal: 76.00%</text>

  <text x="60" y="684" font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#8A8F98">Source: field study of an ultrasonic fine-mist system coupled to forced ventilation in a 175 m² tunnel section, comparing three start conditions after blasting.</text>
</svg>
